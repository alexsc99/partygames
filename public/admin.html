<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Party-Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1340">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
 body { padding: 16px; max-width: 540px; margin: 0 auto; }
 h1 { font-size: 22px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
 .card { background: #2d2266; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
 .label { font-size: 12px; opacity: .75; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
 .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
 .modes button { padding: 12px 6px; background: #1b1340; font-size: 14px; font-weight: 700; border: 2px solid transparent; }
 .modes button.active { background: #4b3a9e; border-color: #ffd33d; }
 .cats { display: flex; flex-wrap: wrap; gap: 8px; }
 .cats button { padding: 9px 12px; background: #1b1340; font-size: 13px; font-weight: 700; border: 2px solid transparent; border-radius: 20px; }
 .cats button.active { background: #4b3a9e; border-color: #ffd33d; }
 .cats button.hot.active { background: #8f1d45; border-color: #ff6b9d; }
 .go { background: #26890c; padding: 16px; width: 100%; font-size: 20px; font-weight: 700; margin-top: 8px; }
 .warn { background: #e21b3c; padding: 13px; width: 100%; font-size: 16px; font-weight: 700; margin-top: 8px; }
 .q { font-size: 17px; font-weight: 700; margin: 6px 0; }
 .plist { display: flex; flex-direction: column; gap: 6px; }
 .prow { display: flex; justify-content: space-between; align-items: center; background: #1b1340; padding: 9px 12px; border-radius: 10px; font-size: 15px; }
 .kick { background: #e21b3c; padding: 5px 10px; font-size: 13px; border-radius: 8px; margin-left: 8px; }
 .badge { font-size: 12px; background: #4b3a9e; padding: 4px 10px; border-radius: 20px; }
 #adminConnBanner { display: none; position: sticky; top: 8px; z-index: 90; background: rgba(226,27,60,.94); color: #fff; font-weight: 700; font-size: 13px; padding: 9px 12px; border-radius: 10px; margin-bottom: 10px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
</style></head>
<body>
 <div id="adminConnBanner">🔄 Verbindung unterbrochen — verbinde neu…</div>
 <div id="app"></div>
 <div class="card" id="qrCard">
   <div class="label">🔗 QR-Code / Spieler-URL</div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
     <input id="qrInput" placeholder="https://party.goldens.cloud/" style="flex:1;min-width:180px;padding:10px;border-radius:10px;border:1px solid #ffffff33;background:#1b1340;color:#fff;font-size:14px">
     <button class="go" style="width:auto;margin:0;padding:10px 14px;font-size:14px" onclick="saveQrUrl()">Speichern</button>
     <button class="kick" style="margin:0;padding:10px 12px;background:#4b3a9e" onclick="resetQrUrl()">Standard</button>
   </div>
   <div id="qrFb" style="font-size:12px;margin-top:6px;opacity:.85"></div>
 </div>
 <div class="card" id="customCard">
   <div class="label">➕ Eigene Insider-Frage hinzufügen</div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
     <select id="cMode" onchange="renderCustomFields()" style="flex:1;min-width:140px;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px">
       <option value="mostlikely">🍻 Wer würde am ehesten?</option>
       <option value="wouldyourather">⚖️ Entweder-Oder</option>
       <option value="taboo">🗣️ Erklär-Spiel (Tabu)</option>
     </select>
     <select id="cCat" style="flex:1;min-width:140px;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px"></select>
   </div>
   <div id="cFields"></div>
   <button class="go" style="margin-top:8px;padding:11px;font-size:15px" onclick="addCustom()">Hinzufügen</button>
   <div id="cFb" style="font-size:12px;margin-top:6px;opacity:.85"></div>
 </div>
<script src="/js/ux-helpers.js"></script>
<script src="/socket.io/socket.io.min.js"></script>
<script>
const GAMES = [
  ['quiz', '🎉 Party-Quiz'],
  ['mostlikely', '🍻 Wer würde am ehesten?'],
  ['wouldyourather', '⚖️ Entweder-Oder'],
  ['estimate', '🎯 Schätz-Duell'],
  ['reaction', '⚡ Reaktions-Buzzer'],
  ['neverhavei', '🙈 Ich hab noch nie…'],
  ['imposter', '🕵️ Imposter'],
  ['draw', '🎨 Zeichnen & Raten'],
  ['taboo', '🗣️ Erklär-Spiel (Tabu)'],
  ['sort', '🔢 Sortier-Duell'],
  ['icebreaker', '🫶 Kennenlernen'],
  ['teams', '🏆 Team-Wahl'],
  ['scale', '📊 Skala 1–10'],
  ['truthlie', '🎭 2 Wahrheiten, 1 Lüge'],
  ['wordassoc', '⚡ Wort-Assoziation'],
  ['songquiz', '🎵 Erkenne den Song'],
  ['imagequiz', '🖼️ Bild-Quiz'],
  ['mix', '🎲 Party-Mix'],
];
const CATS = [
  ['party', '🎉 Party & Freunde'],
  ['peinlich', '🍻 Peinlich & Eskaliert'],
  ['kennenlernen', '💬 Kennenlernen & Deep Talk'],
  ['date', '💘 Date'],
  ['hot18', '🔥 Hot 18+'],
];
const MIX_OPTS = [
  ['quiz', '🎉 Quiz'],
  ['mostlikely', '🍻 Wer würde'],
  ['wouldyourather', '⚖️ Entweder-Oder'],
  ['estimate', '🎯 Schätz-Duell'],
  ['neverhavei', '🙈 Noch nie'],
  ['teams', '🏆 Team-Wahl'],
  ['scale', '📊 Skala'],
  ['icebreaker', '🫶 Kennenlernen'],
  ['wordassoc', '⚡ Wort-Assoz.'],
  ['taboo', '🗣️ Tabu'],
  ['sort', '🔢 Sortieren'],
  ['songquiz', '🎵 Song-Quiz'],
  ['imagequiz', '🖼️ Bild-Quiz'],
];
const ROOM_CODE = (new URLSearchParams(location.search).get('room') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
async function createAndOpenAdmin() {
  try {
    const r = await fetch('/api/rooms', { method: 'POST' });
    const d = await r.json();
    if (d && d.code) {
      if (d.hostToken) localStorage.setItem('pg_host_' + d.code, d.hostToken);
      location.replace('/admin?room=' + encodeURIComponent(d.code));
    }
  } catch {}
}
if (!ROOM_CODE) { createAndOpenAdmin(); }
const socket = ROOM_CODE ? pgConnect(ROOM_CODE, 'admin') : { on(){}, emit(){} };
if (ROOM_CODE) {
  const connBanner = document.getElementById('adminConnBanner');
  socket.on('connect', () => {
    if (connBanner) connBanner.style.display = 'none';
    const tok = localStorage.getItem('pg_host_' + ROOM_CODE);
    if (tok) socket.emit('host:auth', tok);
  });
  socket.on('disconnect', () => {
    if (connBanner) connBanner.style.display = 'block';
  });
  if (socket.io) {
    socket.io.on('reconnect_attempt', () => {
      if (connBanner) connBanner.style.display = 'block';
    });
  }
  socket.on('room:error', () => createAndOpenAdmin());
}
let S = null; let qrInited = false; let lastAdminSig = '';
function copyRoomLink() {
  const link = location.origin + '/?room=' + encodeURIComponent(ROOM_CODE);
  navigator.clipboard?.writeText(link).catch(() => {});
  const btn = document.getElementById('copyLinkBtn');
  if (btn) { btn.textContent = '✅ Link kopiert!'; setTimeout(() => { btn.textContent = '📋 Einladungs-Link kopieren'; }, 2000); }
}
const app = document.getElementById('app');
// esc() is provided by /js/ux-helpers.js
document.getElementById('cCat').innerHTML = CATS.map(([id, lbl]) => `<option value="${id}">${lbl}</option>`).join('');
function renderCustomFields() {
  const m = document.getElementById('cMode').value;
  const f = document.getElementById('cFields');
  const st = 'width:100%;box-sizing:border-box;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px;margin-top:6px';
  if (m === 'mostlikely') f.innerHTML = `<input id="cfQ" placeholder="Wer würde am ehesten…" style="${st}">`;
  else if (m === 'wouldyourather') f.innerHTML = `<input id="cfA" placeholder="Option A" style="${st}"><input id="cfB" placeholder="Option B" style="${st}">`;
  else f.innerHTML = `<input id="cfW" placeholder="Zu erklärendes Wort" style="${st}"><input id="cfT" placeholder="Tabu-Wörter (kommagetrennt, z. B. Bier, Glas, Party)" style="${st}">`;
}
renderCustomFields();
function addCustom() {
  const mode = document.getElementById('cMode').value;
  const cat = document.getElementById('cCat').value;
  const payload = { mode, cat };
  if (mode === 'mostlikely') payload.q = document.getElementById('cfQ')?.value || '';
  else if (mode === 'wouldyourather') { payload.a = document.getElementById('cfA')?.value || ''; payload.b = document.getElementById('cfB')?.value || ''; }
  else { payload.word = document.getElementById('cfW')?.value || ''; payload.taboo = document.getElementById('cfT')?.value || ''; }
  socket.emit('host:addCustom', payload, r => {
    const fb = document.getElementById('cFb');
    if (r && r.ok) { fb.textContent = '✓ Gespeichert!'; renderCustomFields(); }
    else fb.textContent = '❌ ' + ((r && r.error) || 'Fehler');
  });
}
function saveQrUrl() {
  const v = document.getElementById('qrInput').value.trim();
  socket.emit('host:publicUrl', v, r => {
    const fb = document.getElementById('qrFb');
    if (r && r.ok) { fb.textContent = '✓ QR-Code URL aktualisiert: ' + r.url; document.getElementById('qrInput').value = r.url; }
    else fb.textContent = '❌ ' + ((r && r.error) || 'Ungültige URL');
  });
}
function resetQrUrl() {
  socket.emit('host:publicUrl', '', r => {
    if (r && r.ok) {
      document.getElementById('qrInput').value = r.url;
      document.getElementById('qrFb').textContent = '✓ Auf Standard zurückgesetzt: ' + r.url;
    }
  });
}
function toggleMixMode(id) {
  const cur = new Set((S && S.mixModes) || []);
  if (cur.has(id)) {
    if (cur.size <= 2) return;
    cur.delete(id);
  } else cur.add(id);
  socket.emit('host:mixModes', [...cur]);
}
socket.on('state', s => {
  S = s;
  if (!qrInited && s.publicUrl) {
    document.getElementById('qrInput').value = s.publicUrl;
    qrInited = true;
  }
  render();
});
function toggleCat(id) {
  const cur = new Set((S && S.categories) || []);
  if (id === 'all') return socket.emit('host:categories', CATS.map(c => c[0]));
  if (cur.has(id)) {
    if (cur.size === 1) return;
    cur.delete(id);
  } else {
    cur.add(id);
  }
  socket.emit('host:categories', [...cur]);
}
function kick(i) {
  const n = S.players[i] && S.players[i].name;
  if (n && confirm(n + ' entfernen?')) socket.emit('host:kick', n);
}
function render() {
  if (!S) return;
  const activeEl = document.activeElement;
  if (activeEl && activeEl.tagName === 'INPUT' && activeEl.type === 'range' && app.contains(activeEl)) {
    return;
  }
  const done = S.players.filter(p => p.answered).length;
  let mainBtn = '';
  if (S.phase === 'lobby') mainBtn = `<button class="go" onclick="socket.emit('host:start')">▶ Spiel starten</button>`;
  else if (S.phase === 'spin') mainBtn = `<button class="go" style="background:#d89e00" onclick="socket.emit('host:next')">⏭ Drehrad überspringen</button>`;
  else if (S.phase === 'discuss') mainBtn = `<button class="go" onclick="socket.emit('host:next')">🗳 Abstimmung starten</button>`;
  else if (S.phase === 'write') mainBtn = `<button class="go" style="background:#d89e00" onclick="socket.emit('host:next')">⏭ Runde überspringen</button>`;
  else if (S.phase === 'wait') mainBtn = `<button class="go" style="background:#555" disabled>⏳ Warte auf GRÜN…</button>`;
  else if (S.phase === 'question' || S.phase === 'go') mainBtn = `<button class="go" style="background:#d89e00" onclick="socket.emit('host:next')">⏭ Auswertung zeigen (${done}/${S.players.length})</button>`;
  else if (S.phase === 'result') mainBtn = `<button class="go" onclick="socket.emit('host:next')">▶ Nächste Runde</button>`;
  else mainBtn = `<button class="go" onclick="socket.emit('host:start')">🔄 Nochmal spielen</button>`;

  const statusTxt = S.paused ? '⏸ PAUSE'
    : S.phase === 'lobby' ? 'Lobby'
    : S.phase === 'end' ? 'Spiel vorbei'
    : `Runde ${S.idx + 1}/${S.total} (${S.phase})`;

  const mr = S.missionReveal;
  const adminSig = [
    ROOM_CODE, S.mode, S.phase, S.idx, S.total, S.paused,
    (S.categories || []).join(','),
    (S.mixModes || []).join(','), S.mixRounds,
    (S.imageQuizThemes || []).join(','),
    S.songLangs?.en !== false, S.songLangs?.de !== false,
    S.effectiveRussianShare ?? S.russianShare ?? 0, S.songOnlyArtistTitle,
    S.roundLimit, S.teamMode, S.displayMode || (S.noTvMode ? 'notv' : 'tv'),
    S.timerSpeed, S.finalDouble, S.wheelEnabled !== false, S.secretMissions, S.alcoholFree,
    S.lobbyBanner || '', S.spin?.id || '',
    S.q?.q || '', S.q?.drawer || '', S.q?.guessed ? S.q.guessed.length : '',
    mr ? `${mr.playerName}:${mr.resolved}:${mr.success}` : '',
    S.players.map(p => `${p.name}:${p.avatar}:${p.team || ''}:${p.score}`).join(','),
  ].join('|');

  if (adminSig === lastAdminSig && document.getElementById('adminMainBtn') && document.getElementById('adminStatus')) {
    document.getElementById('adminStatus').textContent = statusTxt;
    document.getElementById('adminMainBtn').innerHTML = mainBtn;
    document.querySelectorAll('#adminPlist .ansMark').forEach((el, i) => {
      const want = S.players[i]?.answered ? ' ✓' : '';
      if (el.textContent !== want) el.textContent = want;
    });
    return;
  }
  lastAdminSig = adminSig;

  const canPause = ['question', 'go', 'result'].includes(S.phase);
  const pauseBtn = canPause
    ? `<button class="go" style="background:${S.paused ? '#26890c' : '#4b3a9e'}" onclick="socket.emit('host:pause')">${S.paused ? '▶ Weiter' : '⏸ Pause'}</button>`
    : '';

  const activeCats = S.categories || [];
  const allActive = CATS.every(([id]) => activeCats.includes(id));

  app.innerHTML = `
    <h1><span>🎛️ Admin · Raum <b>${esc(ROOM_CODE)}</b></span><span id="adminStatus" class="badge">${statusTxt}</span></h1>
    <div class="card cats" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <button id="copyLinkBtn" class="active" onclick="copyRoomLink()">📋 Einladungs-Link kopieren</button>
      <a href="/host?room=${encodeURIComponent(ROOM_CODE)}" target="_blank" style="text-decoration:none"><button type="button">📺 TV öffnen (/host)</button></a>
      <button type="button" onclick="createAndOpenAdmin()">➕ Neuer Raum</button>
    </div>
    ${S.phase === 'result' && S.missionReveal ? `
      <div class="card" style="border:1px solid rgba(255,211,61,.45);background:rgba(255,211,61,.08)">
        <div class="label" style="color:#ffd33d">🕵️ Geheime Mission von ${esc(S.missionReveal.playerName)}</div>
        <div style="font-size:1rem;font-weight:700;margin:6px 0 10px">„${esc(S.missionReveal.text)}“</div>
        ${S.missionReveal.resolved
          ? `<div style="font-weight:700;color:${S.missionReveal.success ? '#3dd68c' : '#ff6b81'}">${S.missionReveal.success ? '✅ Geschafft (+150 Punkte) — geht gleich weiter…' : '❌ Aufgeflogen (0 Punkte) — geht gleich weiter…'}</div>`
          : `<div class="cats">
              <button class="active" style="background:#26890c" onclick="socket.emit('host:resolveMission',true)">✅ Geschafft (+150 Pkt)</button>
              <button class="active" style="background:#e21b3c" onclick="socket.emit('host:resolveMission',false)">❌ Aufgeflogen (0 Pkt)</button>
            </div>`}
      </div>
    ` : ''}
    <div class="card">
      <div class="label">Spiel auswählen (wechselt in Lobby)</div>
      <div class="modes">${GAMES.map(([id, label]) => `<button class="${S.mode === id ? 'active' : ''}" onclick="socket.emit('host:mode','${id}')">${label}</button>`).join('')}</div>
    </div>
    ${(() => {
      const isMix = S.mode === 'mix';
      const mixArr = S.mixModes || [];
      const showCats = !['songquiz', 'imagequiz', 'reaction', 'truthlie'].includes(S.mode);
      const showRounds = S.mode !== 'reaction';
      const showImageQuiz = S.mode === 'imagequiz' || (isMix && mixArr.includes('imagequiz'));
      const showSongQuiz = S.mode === 'songquiz' || (isMix && mixArr.includes('songquiz'));
      const iqThemes = S.imageQuizThemes || ['logos', 'landmarks', 'flags', 'cars'];
      const iqAll = ['logos', 'landmarks', 'flags', 'cars'].every(t => iqThemes.includes(t));
      return `<div class="card">
      <div class="label">🎛️ Schnell-Presets</div>
      <div class="cats" style="margin-bottom:12px">
        <button onclick="socket.emit('host:preset','klassik')">🎉 Klassik</button>
        <button onclick="socket.emit('host:preset','date')">💘 Date</button>
        <button class="hot" onclick="socket.emit('host:preset','hot18')">🔥 18+</button>
        <button onclick="socket.emit('host:preset','musik')">🎵 Musik</button>
        <button onclick="socket.emit('host:preset','alkoholfrei')">🥤 Alkoholfrei</button>
      </div>
      ${isMix ? `
        <div class="label">🎲 Party-Mix Modi (min. 2)</div>
        <div class="cats" style="margin-bottom:10px">
          ${MIX_OPTS.map(([id, lbl]) => `<button class="${mixArr.includes(id) ? 'active' : ''}" onclick="toggleMixMode('${id}')">${lbl}</button>`).join('')}
        </div>
        <div class="label">🔁 Party-Mix Runden</div>
        <div class="cats" style="margin-bottom:12px">
          ${[8, 12, 16].map(n => `<button class="${(S.mixRounds || 12) === n ? 'active' : ''}" onclick="socket.emit('host:mixRounds',${n})">${n} Runden</button>`).join('')}
        </div>
      ` : ''}
      ${showCats ? `
        <div class="label">Fragen-Kategorie (${S.total} Runden aktiv)</div>
        <div class="cats" style="margin-bottom:12px">
          <button class="${allActive ? 'active' : ''}" onclick="toggleCat('all')">🌟 Alle</button>
          ${CATS.map(([id, label]) => `<button class="${activeCats.includes(id) ? 'active' : ''} ${id === 'hot18' ? 'hot' : ''}" onclick="toggleCat('${id}')">${label}</button>`).join('')}
        </div>
      ` : ''}
      ${showImageQuiz ? `
        <div class="label">🖼️ Bild-Quiz Themen (${S.total} Runden aktiv)</div>
        <div class="cats" style="margin-bottom:12px">
          <button class="${iqAll ? 'active' : ''}" onclick="socket.emit('host:imageQuizThemes',['logos','landmarks','flags','cars'])">🌟 Alle</button>
          <button class="${iqThemes.includes('logos') ? 'active' : ''}" onclick="socket.emit('host:imageQuizTheme',{theme:'logos',on:${!iqThemes.includes('logos')}})">🏢 Firmen-Logos</button>
          <button class="${iqThemes.includes('landmarks') ? 'active' : ''}" onclick="socket.emit('host:imageQuizTheme',{theme:'landmarks',on:${!iqThemes.includes('landmarks')}})">🗼 Sehenswürdigkeiten</button>
          <button class="${iqThemes.includes('flags') ? 'active' : ''}" onclick="socket.emit('host:imageQuizTheme',{theme:'flags',on:${!iqThemes.includes('flags')}})">🏁 Flaggen</button>
          <button class="${iqThemes.includes('cars') ? 'active' : ''}" onclick="socket.emit('host:imageQuizTheme',{theme:'cars',on:${!iqThemes.includes('cars')}})">🚗 Automarken</button>
        </div>
      ` : ''}
      ${showSongQuiz ? `
        <div class="label">🎵 Erkenne den Song (${S.total} Runden aktiv)</div>
        <div class="cats">
          <button class="${S.songLangs?.en !== false ? 'active' : ''}" onclick="socket.emit('host:songLang',{lang:'en',on:${S.songLangs?.en === false}})">🇬🇧 Englisch</button>
          <button class="${S.songLangs?.de !== false ? 'active' : ''}" onclick="socket.emit('host:songLang',{lang:'de',on:${S.songLangs?.de === false}})">🇩🇪 Deutsch</button>
        </div>
        <div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08)">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin-bottom:6px">
            <span>🇷🇺 Russisch-Anteil</span>
            <strong id="ru-share-lbl">${(S.effectiveRussianShare ?? S.russianShare ?? 0) === 0 ? '0% (Aus)' : ((S.effectiveRussianShare ?? S.russianShare ?? 0) === 100 ? '100% (Nur Russisch)' : (S.effectiveRussianShare ?? S.russianShare ?? 0) + '%')}</strong>
          </div>
          <input type="range" min="0" max="100" step="10" value="${S.effectiveRussianShare ?? S.russianShare ?? 0}"
            oninput="const v=Number(this.value);document.getElementById('ru-share-lbl').textContent=v===0?'0% (Aus)':(v===100?'100% (Nur Russisch)':v+'%')"
            onchange="socket.emit('host:russianShare',Number(this.value))"
            style="width:100%;accent-color:var(--accent,#ff4d6d);cursor:pointer">
        </div>
        <div class="cats" style="margin-top:10px;margin-bottom:12px">
          <button class="${!S.songOnlyArtistTitle ? 'active' : ''}" onclick="socket.emit('host:songDifficulty',false)">🎯 Alle Fragetypen</button>
          <button class="${S.songOnlyArtistTitle ? 'active' : ''}" onclick="socket.emit('host:songDifficulty',true)">🎤 Nur Interpret & Titel</button>
        </div>
      ` : ''}
      ${showRounds ? `
        <div class="label">Runden-Limit</div>
        <div class="cats" style="margin-bottom:12px">
          ${[[0, 'Alle'], [5, '5 Runden'], [10, '10 Runden'], [15, '15 Runden']].map(([n, lbl]) => `<button class="${(S.roundLimit || 0) === n ? 'active' : ''}" onclick="socket.emit('host:rounds',${n})">${lbl}</button>`).join('')}
        </div>
      ` : ''}
      <div class="label">Spielmodus</div>
      <div class="cats" style="margin-bottom:12px">
        <button class="${!S.teamMode ? 'active' : ''}" onclick="socket.emit('host:teamMode',false)">👤 Einzelspieler</button>
        <button class="${S.teamMode ? 'active' : ''}" onclick="socket.emit('host:teamMode',true)">👥 Team-Spiel</button>
      </div>
      <div class="label">Anzeige</div>
      <div class="cats" style="margin-bottom:12px">
        <button class="${(S.displayMode || (S.noTvMode ? 'notv' : 'tv')) === 'tv' ? 'active' : ''}" onclick="socket.emit('host:displayMode','tv')">📺 Mit TV (/host)</button>
        <button class="${S.displayMode === 'notv' ? 'active' : ''}" onclick="socket.emit('host:displayMode','notv')">📱 Ohne TV (jeder am Handy)</button>
        <button class="${S.displayMode === 'onedevice' ? 'active' : ''}" onclick="socket.emit('host:displayMode','onedevice')">🤝 Ein Gerät (Pass & Play)</button>
      </div>
      <div class="label">⏱️ Timer-Tempo</div>
      <div class="cats" style="margin-bottom:12px">
        ${[['fast', '⚡ Schnell'], ['normal', '⏱️ Normal'], ['relaxed', '🐢 Entspannt']].map(([sp, lbl]) => `<button class="${(S.timerSpeed || 'normal') === sp ? 'active' : ''}" onclick="socket.emit('host:timerSpeed','${sp}')">${lbl}</button>`).join('')}
      </div>
      <div class="label">⚡ Spiel-Optionen</div>
      <div class="cats">
        <button class="${S.finalDouble ? 'active' : ''}" onclick="socket.emit('host:finalDouble',!S.finalDouble)">🔥 Finalrunde 2× Punkte: ${S.finalDouble ? 'An' : 'Aus'}</button>
        <button class="${S.wheelEnabled !== false ? 'active' : ''}" onclick="socket.emit('host:wheelEnabled',S.wheelEnabled===false)">🎡 Drehrad-Animation: ${S.wheelEnabled !== false ? 'An' : 'Aus'}</button>
        <button class="${S.secretMissions ? 'active' : ''}" onclick="socket.emit('host:secretMissions',!S.secretMissions)">🕵️ Geheime Missionen: ${S.secretMissions ? 'An' : 'Aus'}</button>
        <button class="${S.alcoholFree ? 'active' : ''}" onclick="socket.emit('host:alcoholFree',!S.alcoholFree)">🥤 Alkoholfrei: ${S.alcoholFree ? 'An' : 'Aus'}</button>
      </div>
      ${S.phase === 'lobby' ? `
        <div class="label" style="margin-top:12px">🎰 Glücksrad direkt drehen (Lobby)</div>
        <div class="cats">
          <button class="active" onclick="socket.emit('host:spinWheel','mode')">🎰 Zufalls-Spiel drehen</button>
          <button class="active" ${S.players.length < 1 ? 'disabled style="opacity:.45"' : ''} onclick="socket.emit('host:spinWheel','player')">🎡 Spieler auslosen</button>
        </div>
      ` : ''}
    </div>`;
    })()}
    <div class="card">
      <div class="label">Steuerung</div>
      ${S.phase === 'spin' && S.spin ? `<div class="q" style="color:#ffd33d">🎡 ${esc(S.spin.title)} → ${esc(S.spin.winnerLabel)}</div>` : ''}
      ${S.phase === 'lobby' && S.lobbyBanner ? `<div class="q" style="color:#ffd33d">${esc(S.lobbyBanner)}</div>` : ''}
      ${S.q && S.q.q ? `<div class="q">${esc(S.q.q)}</div>` : ''}
      ${S.mode === 'draw' && S.q && S.q.drawer ? `<div class="q">Maler: ${esc(S.q.drawer)} (${S.q.guessed.length} erraten)</div>` : ''}
      <div id="adminMainBtn">${mainBtn}</div>
      ${pauseBtn}
      <button class="warn" onclick="socket.emit('host:reset')">🏠 Reset (zur Lobby)</button>
    </div>
    <div class="card">
      <div class="label">Spieler (${S.players.length})</div>
      <div id="adminPlist" class="plist">${S.players.length ? S.players.map((p, i) => `
        <div class="prow">
          <span>${S.teamMode && p.team ? ({ red: '🔴', blue: '🔵', yellow: '🟡', green: '🟢', purple: '🟣', orange: '🟠', pink: '🩷', teal: '🩵' }[p.team] || '⚪') + ' ' : ''}${p.avatar ? esc(p.avatar) + ' ' : ''}${esc(p.name)}<span class="ansMark">${p.answered ? ' ✓' : ''}</span></span>
          <span><b>${p.score} Pkt</b><button class="kick" onclick="kick(${i})">✕</button></span>
        </div>`).join('') : '<div style="opacity:.6">Noch keine Spieler</div>'}
      </div>
    </div>`;
}
</script>
</body></html>
