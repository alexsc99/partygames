<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Party-Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1340">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
 body { padding: 16px; padding-bottom: calc(128px + env(safe-area-inset-bottom)); max-width: 540px; margin: 0 auto; }
 h1 { font-size: 22px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
 .card { background: #2d2266; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
 .label { font-size: 12px; opacity: .75; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
 .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
 .modes button { padding: 12px 6px; background: #1b1340; font-size: 14px; font-weight: 700; border: 2px solid transparent; }
 .modes button.active { background: #4b3a9e; border-color: #ffd33d; }
 .cats { display: flex; flex-wrap: wrap; gap: 8px; }
 .cats button { padding: 9px 12px; background: #1b1340; font-size: 13px; font-weight: 700; border: 2px solid transparent; border-radius: 20px; }
 .cats button.active { background: #4b3a9e; border-color: #ffd33d; }
 .cats button.hot.active { background: #8f1d45; border-color: #ff6b9d; }
 .go { background: #26890c; padding: 16px; width: 100%; font-size: 20px; font-weight: 700; margin-top: 8px; }
 .warn { background: #e21b3c; padding: 13px; width: 100%; font-size: 16px; font-weight: 700; margin-top: 8px; }
 .q { font-size: 17px; font-weight: 700; margin: 6px 0; }
 .plist { display: flex; flex-direction: column; gap: 6px; }
 .prow { display: flex; justify-content: space-between; align-items: center; background: #1b1340; padding: 9px 12px; border-radius: 10px; font-size: 15px; }
 .kick { background: #e21b3c; padding: 5px 10px; font-size: 13px; border-radius: 8px; margin-left: 8px; }
 .badge { font-size: 12px; background: #4b3a9e; padding: 4px 10px; border-radius: 20px; }
 #adminConnBanner { display: none; position: sticky; top: 8px; z-index: 90; background: rgba(226,27,60,.94); color: #fff; font-weight: 700; font-size: 13px; padding: 9px 12px; border-radius: 10px; margin-bottom: 10px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
 /* Einklappbare Einstellungs-Gruppen */
 details.grp { padding: 0; }
 details.grp > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; border-radius: 14px; }
 details.grp > summary::-webkit-details-marker { display: none; }
 details.grp > summary::after { content: '▾'; flex-shrink: 0; font-size: 14px; opacity: .65; transition: transform .2s ease; }
 details.grp[open] > summary::after { transform: rotate(180deg); }
 details.grp > summary:focus-visible { outline: 2px solid #ffd33d; outline-offset: -2px; }
 .gt { font-weight: 700; font-size: 15px; flex-shrink: 0; }
 .gs { margin-left: auto; min-width: 0; font-size: 13px; opacity: .7; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 .gb { padding: 0 14px 14px; }
 details.grp[open] > .gb { animation: fadeSlideUp .22s ease both; }
 .sub { font-size: 12px; opacity: .75; margin: 12px 0 8px; text-transform: uppercase; letter-spacing: .5px; }
 .sub:first-child { margin-top: 0; }
 /* Fixierte Aktionsleiste unten */
 #adminBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; background: #1b1340; border-top: 1px solid #ffffff1f; box-shadow: 0 -8px 24px rgba(0,0,0,.45); padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
 #adminBar .barInner { max-width: 540px; margin: 0 auto; }
 #adminBarStatus { font-size: 12px; opacity: .75; text-align: center; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 #adminBar .barRow { display: flex; gap: 8px; align-items: stretch; }
 #adminMainBtn { flex: 1; min-width: 0; display: flex; }
 #adminMainBtn .go { margin: 0; padding: 10px; min-height: 56px; font-size: 17px; line-height: 1.2; }
 #adminBarSide { display: flex; gap: 8px; }
 .barBtn { width: 62px; min-height: 56px; padding: 6px 2px; background: #4b3a9e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 700; }
 .barBtn span { font-size: 20px; line-height: 1; }
 .barBtn small { font-size: 11px; line-height: 1.1; }
 .barBtn.warnBtn { background: #e21b3c; }
</style></head>
<body>
 <div id="adminConnBanner">🔄 Verbindung unterbrochen — verbinde neu…</div>
 <div id="app"></div>
<details class="card grp" id="qrCard">
  <summary><span class="gt">🔗 QR-Code / Spieler-URL</span><span class="gs" id="qrSum">Standard</span></summary>
  <div class="gb">
   <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
     <input id="qrInput" placeholder="https://party.goldens.cloud/" style="flex:1;min-width:180px;padding:10px;border-radius:10px;border:1px solid #ffffff33;background:#1b1340;color:#fff;font-size:14px">
     <button class="go" style="width:auto;margin:0;padding:10px 14px;font-size:14px" onclick="saveQrUrl()">Speichern</button>
     <button class="kick" style="margin:0;padding:10px 12px;background:#4b3a9e" onclick="resetQrUrl()">Standard</button>
   </div>
  <div id="qrFb" style="font-size:12px;margin-top:6px;opacity:.85"></div>
  </div>
</details>
<details class="card grp" id="customCard">
  <summary><span class="gt">➕ Eigene Insider-Frage</span><span class="gs">Wer würde · Entweder-Oder · Tabu</span></summary>
  <div class="gb">
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
     <select id="cMode" onchange="renderCustomFields()" style="flex:1;min-width:140px;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px">
       <option value="mostlikely">🍻 Wer würde am ehesten?</option>
       <option value="wouldyourather">⚖️ Entweder-Oder</option>
       <option value="taboo">🗣️ Erklär-Spiel (Tabu)</option>
     </select>
     <select id="cCat" style="flex:1;min-width:140px;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px"></select>
   </div>
   <div id="cFields"></div>
   <button class="go" style="margin-top:8px;padding:11px;font-size:15px" onclick="addCustom()">Hinzufügen</button>
  <div id="cFb" style="font-size:12px;margin-top:6px;opacity:.85"></div>
  </div>
</details>
<details class="card grp" id="cardCustom">
  <summary><span class="gt">🎪 Eigene Party-Karte</span><span class="gs" id="ccSum">0 eigene</span></summary>
  <div class="gb">
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
     <select id="ccType" style="flex:1;min-width:140px;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px">
       <option value="group">🎉 Gruppen-Challenge (Handys stimmen „geschafft?“ ab)</option>
       <option value="vote">🎤 Reihum-Runde (bester Beitrag per Handy)</option>
       <option value="duel">⚡ Blitz-Duell (2 Ausgeloste)</option>
       <option value="rule">📜 Neue Regel (3 Runden)</option>
       <option value="snap">📸 Foto-Challenge (nur Remote)</option>
       <option value="crowd">👥 Mitmach-Karte („Alle mit Brille …“, ohne Punkte)</option>
     </select>
     <select id="ccWhere" style="flex:1;min-width:140px;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px">
       <option value="both">🏠🌍 Vor Ort & Remote</option>
       <option value="local">🏠 Nur vor Ort</option>
       <option value="remote">🌍 Nur Remote</option>
     </select>
   </div>
   <textarea id="ccText" rows="2" maxlength="200" placeholder="Aufgabe, z. B. „Jeder erzählt seinen peinlichsten Moment mit Tim“ – {a}/{b} = zwei zufällige Spieler, {player} = einer" style="width:100%;box-sizing:border-box;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px;font-family:inherit"></textarea>
   <button class="go" style="margin-top:8px;padding:11px;font-size:15px" onclick="addPartyCard()">Karte hinzufügen</button>
   <div id="ccFb" style="font-size:12px;margin-top:6px;opacity:.85"></div>
   <div id="ccList" class="plist" style="margin-top:8px"></div>
  </div>
</details>
<div style="text-align:center;font-size:11px;opacity:.45;margin:14px 0 4px">PartyGame v__APP_VERSION__</div>
<div id="adminBar">
  <div class="barInner">
    <div id="adminBarStatus"></div>
    <div class="barRow"><div id="adminMainBtn"></div><div id="adminBarSide"></div></div>
  </div>
</div>
<script src="/js/ux-helpers.js"></script>
<script src="/socket.io/socket.io.min.js"></script>
<script>
const GAMES = [
  ['quiz', '🎉 Party-Quiz'],
  ['mostlikely', '🍻 Wer würde am ehesten?'],
  ['wouldyourather', '⚖️ Entweder-Oder'],
  ['estimate', '🎯 Schätz-Duell'],
  ['reaction', '⚡ Reaktions-Buzzer'],
  ['neverhavei', '🙈 Ich hab noch nie…'],
  ['imposter', '🕵️ Imposter'],
  ['draw', '🎨 Zeichnen & Raten'],
  ['taboo', '🗣️ Erklär-Spiel (Tabu)'],
  ['pantomime', '🤸 Pantomime'],
  ['sort', '🔢 Sortier-Duell'],
  ['icebreaker', '🫶 Kennenlernen'],
  ['teams', '🏆 Team-Wahl'],
  ['scale', '📊 Skala 1–10'],
  ['truthlie', '🎭 2 Wahrheiten, 1 Lüge'],
  ['wordassoc', '⚡ Wort-Assoziation'],
  ['songquiz', '🎵 Erkenne den Song'],
  ['imagequiz', '🖼️ Bild-Quiz'],
  ['hotseat', '🔥 Heißer Stuhl'],
  ['mix', '🎲 Party-Mix'],
];
const CATS = [
  ['party', '🎉 Party & Freunde'],
  ['peinlich', '🍻 Peinlich & Eskaliert'],
  ['kennenlernen', '💬 Kennenlernen & Deep Talk'],
  ['date', '💘 Date'],
  ['hot18', '🔥 Hot 18+'],
];
const MIX_OPTS = [
  ['quiz', '🎉 Quiz'],
  ['mostlikely', '🍻 Wer würde'],
  ['wouldyourather', '⚖️ Entweder-Oder'],
  ['estimate', '🎯 Schätz-Duell'],
  ['neverhavei', '🙈 Noch nie'],
  ['teams', '🏆 Team-Wahl'],
  ['scale', '📊 Skala'],
  ['icebreaker', '🫶 Kennenlernen'],
  ['wordassoc', '⚡ Wort-Assoz.'],
  ['taboo', '🗣️ Tabu'],
  ['pantomime', '🤸 Pantomime'],
  ['sort', '🔢 Sortieren'],
  ['songquiz', '🎵 Song-Quiz'],
  ['imagequiz', '🖼️ Bild-Quiz'],
  ['hotseat', '🔥 Heißer Stuhl'],
];
const ROOM_CODE = (new URLSearchParams(location.search).get('room') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
async function createAndOpenAdmin() {
  try {
    const r = await fetch('/api/rooms', { method: 'POST' });
    const d = await r.json();
    if (d && d.code) {
      if (d.hostToken) localStorage.setItem('pg_host_' + d.code, d.hostToken);
      location.replace('/admin?room=' + encodeURIComponent(d.code));
    }
  } catch {}
}
if (!ROOM_CODE) { createAndOpenAdmin(); }
const socket = ROOM_CODE ? pgConnect(ROOM_CODE, 'admin') : { on(){}, emit(){} };
if (ROOM_CODE) {
  const connBanner = document.getElementById('adminConnBanner');
  socket.on('connect', () => {
    if (connBanner) connBanner.style.display = 'none';
    const tok = localStorage.getItem('pg_host_' + ROOM_CODE);
    if (tok) socket.emit('host:auth', tok);
  });
  socket.on('disconnect', () => {
    if (connBanner) connBanner.style.display = 'block';
  });
  if (socket.io) {
    socket.io.on('reconnect_attempt', () => {
      if (connBanner) connBanner.style.display = 'block';
    });
  }
  socket.on('room:error', () => createAndOpenAdmin());
}
let S = null; let qrInited = false; let lastAdminSig = '';
async function copyGalleryLink() {
  let origin = location.origin;
  try { if (S && S.publicUrl) origin = new URL(S.publicUrl).origin; } catch { /* eigene Adresse */ }
  if (await pgCopyText(origin + '/fotos?room=' + encodeURIComponent(ROOM_CODE))) pgToast('✅ Galerie-Link kopiert');
}
async function copyRoomLink() {
  const link = (S && S.publicUrl) || (location.origin + '/?room=' + encodeURIComponent(ROOM_CODE));
  if (!(await pgCopyText(link))) return;
  const btn = document.getElementById('copyLinkBtn');
  if (btn) { btn.textContent = '✅ Link kopiert!'; setTimeout(() => { btn.textContent = '📋 Einladungs-Link kopieren'; }, 2000); }
}
const app = document.getElementById('app');
// esc() is provided by /js/ux-helpers.js
document.getElementById('cCat').innerHTML = CATS.map(([id, lbl]) => `<option value="${id}">${lbl}</option>`).join('');
function renderCustomFields() {
  const m = document.getElementById('cMode').value;
  const f = document.getElementById('cFields');
  const st = 'width:100%;box-sizing:border-box;padding:9px;border-radius:10px;background:#1b1340;color:#fff;border:1px solid #ffffff33;font-size:14px;margin-top:6px';
  if (m === 'mostlikely') f.innerHTML = `<input id="cfQ" placeholder="Wer würde am ehesten…" style="${st}">`;
  else if (m === 'wouldyourather') f.innerHTML = `<input id="cfA" placeholder="Option A" style="${st}"><input id="cfB" placeholder="Option B" style="${st}">`;
  else f.innerHTML = `<input id="cfW" placeholder="Zu erklärendes Wort" style="${st}"><input id="cfT" placeholder="Tabu-Wörter (kommagetrennt, z. B. Bier, Glas, Party)" style="${st}">`;
}
renderCustomFields();
function addCustom() {
  const mode = document.getElementById('cMode').value;
  const cat = document.getElementById('cCat').value;
  const payload = { mode, cat };
  if (mode === 'mostlikely') payload.q = document.getElementById('cfQ')?.value || '';
  else if (mode === 'wouldyourather') { payload.a = document.getElementById('cfA')?.value || ''; payload.b = document.getElementById('cfB')?.value || ''; }
  else { payload.word = document.getElementById('cfW')?.value || ''; payload.taboo = document.getElementById('cfT')?.value || ''; }
  socket.emit('host:addCustom', payload, r => {
    const fb = document.getElementById('cFb');
    if (r && r.ok) { fb.textContent = '✓ Gespeichert!'; renderCustomFields(); }
    else fb.textContent = '❌ ' + ((r && r.error) || 'Fehler');
  });
}
function saveQrUrl() {
  const v = document.getElementById('qrInput').value.trim();
  socket.emit('host:publicUrl', v, r => {
    const fb = document.getElementById('qrFb');
    if (r && r.ok) { fb.textContent = '✓ QR-Code URL aktualisiert: ' + r.url; document.getElementById('qrInput').value = r.url; }
    else fb.textContent = '❌ ' + ((r && r.error) || 'Ungültige URL');
  });
}
function resetQrUrl() {
  socket.emit('host:publicUrl', '', r => {
    if (r && r.ok) {
      document.getElementById('qrInput').value = r.url;
      document.getElementById('qrFb').textContent = '✓ Auf Standard zurückgesetzt: ' + r.url;
    }
  });
}
function toggleMixMode(id) {
  const cur = new Set((S && S.mixModes) || []);
  if (cur.has(id)) {
    if (cur.size <= 2) return;
    cur.delete(id);
  } else cur.add(id);
  socket.emit('host:mixModes', [...cur]);
}
// Eigene Party-Karten: Formular ist statisch (Eingaben gehen bei Status-Updates nicht verloren), nur die Liste wird aktualisiert
const CC_ICON = { group: '🎉', vote: '🎤', duel: '⚡', rule: '📜', snap: '📸', crowd: '👥' };
const CC_WHERE = { both: '🏠🌍', local: '🏠', remote: '🌍' };
let ccSig = '';
function renderCustomCardList() {
  const list = (S && S.customCards) || [];
  const sig = JSON.stringify(list);
  if (sig === ccSig) return;
  ccSig = sig;
  document.getElementById('ccSum').textContent = `${list.length} eigene`;
  document.getElementById('ccList').innerHTML = list.map(c => `<div class="prow"><span>${CC_ICON[c.type] || '🎪'} ${CC_WHERE[c.where] || ''} ${esc(c.text)}</span>
    <button class="kick" title="Löschen" onclick="if(confirm('Karte löschen?'))socket.emit('host:delCard',${esc(JSON.stringify(c.id))})">✕</button></div>`).join('');
}
function addPartyCard() {
  const type = document.getElementById('ccType').value;
  const where = type === 'snap' ? 'remote' : document.getElementById('ccWhere').value;
  const text = document.getElementById('ccText').value;
  socket.emit('host:addCard', { type, where, text }, r => {
    const fb = document.getElementById('ccFb');
    if (r && r.ok) { fb.textContent = '✓ Karte gespeichert – kommt ab jetzt im Kartenstapel vor'; document.getElementById('ccText').value = ''; }
    else fb.textContent = '❌ ' + ((r && r.error) || 'Fehler');
  });
}
socket.on('state', s => {
  S = s;
  renderCustomCardList();
  if (!qrInited && s.publicUrl) {
    document.getElementById('qrInput').value = s.publicUrl;
    qrInited = true;
  }
  const qrSum = document.getElementById('qrSum');
  const qrTxt = s.publicUrl ? s.publicUrl.replace(/^https?:\/\//, '').replace(/\/$/, '') : 'Standard';
  if (qrSum && qrSum.textContent !== qrTxt) qrSum.textContent = qrTxt;
  render();
});
function toggleCat(id) {
  const cur = new Set((S && S.categories) || []);
  if (id === 'all') return socket.emit('host:categories', CATS.map(c => c[0]));
  if (cur.has(id)) {
    if (cur.size === 1) return;
    cur.delete(id);
  } else {
    cur.add(id);
  }
  socket.emit('host:categories', [...cur]);
}
function kick(i) {
  const n = S.players[i] && S.players[i].name;
  if (n && confirm(n + ' entfernen?')) socket.emit('host:kick', n);
}
// Offen/zu-Zustand der Einstellungs-Gruppen überlebt innerHTML-Re-Renders.
const GROUP_DEFAULTS = {
  game: true, players: true, mix: true, cats: true, imagequiz: true, songquiz: true, rounds: true,
  presets: false, team: false, display: false, timer: false, options: false, wheel: false,
};
const groupOpen = {};
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.tagName === 'DETAILS' && d.dataset && d.dataset.g) groupOpen[d.dataset.g] = d.open;
}, true);
function grp(id, title, summary, body) {
  const open = id in groupOpen ? groupOpen[id] : !!GROUP_DEFAULTS[id];
  return `<details class="card grp" data-g="${id}"${open ? ' open' : ''}>
      <summary><span class="gt">${title}</span><span class="gs">${summary}</span></summary>
      <div class="gb">${body}</div>
    </details>`;
}
function setHtml(el, html) {
  if (el && el._html !== html) { el.innerHTML = html; el._html = html; }
}
const PARTY_FREQ = { off: 'Aus', rare: 'Selten', normal: 'Normal', often: 'Oft' };
function renderCardPanel() {
  const c = S.card;
  const q = v => esc(JSON.stringify(v));
  const btn = (lbl, arg, bg) => `<button class="active" style="background:${bg}" onclick="socket.emit('host:cardResolve',${q(arg)})">${lbl}</button>`;
  const others = S.players.filter(p => p.name !== c.target);
  let actions = '';
  if (c.resolved) {
    actions = `<div style="font-weight:800;color:${/^❌/u.test(c.outcome || '') ? '#ff6b81' : '#3dd68c'}">${esc(c.outcome)}${S.leftMs > 0 ? ' — geht gleich weiter…' : ''}</div>`;
  } else if (c.act === 'yesno') {
    const fail = c.type === 'group' ? (S.alcoholFree ? 'alle 5 Kniebeugen' : 'alle trinken') : c.minus ? `−${c.minus}` : '0 Pkt';
    const forWhom = c.pair ? ' für beide' : (c.type === 'group' || c.type === 'photo') ? ' für alle' : '';
    actions = `<div class="sub">📱 Die Spieler stimmen am Handy ab: ${c.voters.length}/${(c.judges || []).length} (mind. 2 Stimmen, Mehrheit entscheidet). Nur wenn nötig selbst entscheiden:</div>
      <div class="cats">${btn(`✅ ${c.type === 'photo' ? 'Gelungen' : 'Geschafft'} (+${c.reward}${forWhom})`, { ok: true }, '#26890c')}${btn(`❌ Nicht geschafft (${fail})`, { ok: false }, '#e21b3c')}</div>`;
  } else if (c.act === 'give') {
    actions = `<div class="sub">Wer bekommt die ${c.amount} Punkte?</div>
      <div class="cats">${others.map(p => btn(`${esc(p.avatar || '😎')} ${esc(p.name)}`, { name: p.name }, '#4b3a9e')).join('')}</div>`;
  } else if (c.act === 'duel') {
    actions = `<div class="sub">Wer hat gewonnen? (+${c.reward})</div><div class="cats">${c.duel.map(n => btn(`🏆 ${esc(n)}`, { name: n }, '#26890c')).join('')}</div>`;
  } else if (c.act === 'mode') {
    const modes = (S.mixModes || []).map(m => GAMES.find(g => g[0] === m)).filter(Boolean);
    actions = `<div class="sub">Welches Spiel hat ${esc(c.target)} gewählt?</div><div class="cats">${modes.map(([id, lbl]) => btn(esc(lbl), { mode: id }, '#4b3a9e')).join('')}</div>`;
  } else if (c.act === 'vote') {
    actions = `<div class="sub">🗳️ ${c.voters.length}/${S.players.length} haben auf dem Handy abgestimmt (wertet automatisch aus, wenn alle fertig sind).</div>
      <div class="cats">${btn(`🏁 Jetzt auswerten (+${c.reward} für den Sieger)`, {}, '#26890c')}</div>`;
  } else if (c.act === 'snap' && c.stage === 'collect') {
    const shooters = c.duel ? c.duel.length : S.players.length;
    actions = `<div class="sub">📸 ${(c.submitted || []).length}/${shooters} Fotos da – die Abstimmung startet automatisch, wenn ${c.duel ? 'beide' : 'alle'} ein Foto haben oder die Zeit abläuft (nur 1 Foto: wird gezeigt, +10).</div>
      <div class="cats"><button class="active" style="background:#4b3a9e" onclick="socket.emit('host:snapVote')">🗳️ Abstimmung jetzt starten</button></div>`;
  } else if (c.act === 'snap') {
    const ready = c.voters.length >= 2;
    actions = `<div class="sub">🗳️ ${c.voters.length}/${(c.snapVoters || []).length} haben auf dem Handy abgestimmt – wertet automatisch aus, wenn alle fertig sind. Kein Zeitlimit; selbst auswerten geht ab 2 Stimmen.</div>

    primary = `<button class="go" onclick="socket.emit('host:pause')">▶ Weiter (Pause beenden)</button>`;

  } else if (canPause) {
    side += `<button class="barBtn" onclick="socket.emit('host:pause')" aria-label="Pause"><span>⏸</span><small>Pause</small></button>`;

  side += `<button class="barBtn warnBtn" onclick="resetToLobby()" aria-label="Reset (zur Lobby)"><span>🏠</span><small>Lobby</small></button>`;
  const game = GAMES.find(g => g[0] === S.mode);

  const statusLine = (game ? game[1] + ' · ' : '') + statusTxt;
  if (barStatus && barStatus.textContent !== statusLine) barStatus.textContent = statusLine;

  setHtml(document.getElementById('adminBarSide'), side);
}

      <div class="sub">Alle im Raum können über den Galerie-Link Fotos ansehen, herunterladen und hochladen. Jedes Foto wird 7 Tage nach dem Hochladen gelöscht. Am Spielende zeigt der TV eine Diashow und einen QR-Code zur Galerie.</div>
      <div class="cats">
        <a href="/fotos?room=${encodeURIComponent(ROOM_CODE)}" target="_blank" style="text-decoration:none"><button type="button" class="active">🖼️ Galerie öffnen</button></a>
        <button type="button" onclick="copyGalleryLink()">📋 Galerie-Link kopieren</button>
        <button type="button" onclick="pgPickPhotos(ROOM_CODE, '', null, true)">📷 Foto aufnehmen</button>
        <button type="button" onclick="pgPickPhotos(ROOM_CODE, '')">🖼️ Fotos aus Galerie</button>
        ${S.photoCount ? `<a href="/api/photos/${encodeURIComponent(ROOM_CODE)}/zip" style="text-decoration:none"><button type="button">⬇️ Alle als ZIP</button></a>` : ''}
      </div>
    `)}
    ${grp('cards', '🎪 Party-Karten', esc((PARTY_FREQ[S.partyCards] || 'Aus') + (S.remote ? ' · 🌍 Remote' : '')), `
      <div class="sub">Zwischen den Runden kommt ab und zu eine Aufgabe: Gruppen-Challenge, Kopfgeld auf den Ersten, Aufholchance für den Letzten, Duell, Reihum-Runde, Foto & Pose oder neue Regel. Ob eine Aufgabe gelungen ist, stimmen die Spieler am Handy ab; Duelle und Punkte-Vergaben wertest du hier aus.</div>
      <div class="cats">
        ${Object.entries(PARTY_FREQ).map(([f, lbl]) => `<button class="${(S.partyCards || 'off') === f ? 'active' : ''}" onclick="socket.emit('host:partyCards','${f}')">${lbl}</button>`).join('')}
      </div>
      <div class="label" style="margin-top:12px">Wo wird gespielt?</div>
      <div class="cats">
        <button class="${!S.remote ? 'active' : ''}" onclick="socket.emit('host:remote',false)">🏠 Zusammen vor Ort</button>
        <button class="${S.remote ? 'active' : ''}" onclick="socket.emit('host:remote',true)">🌍 Remote (Video-Call)</button>
      </div>
      <div class="sub">${S.remote
        ? '🌍 Remote: keine Karten mit Sitznachbarn oder Gruppenfotos. Dafür Foto-Challenges (jeder fotografiert z. B. sein Getränk oder eine Pose, alle wählen anonym das beste Foto) und Kamera-Aufgaben. Tipp: Teile den TV-Bildschirm (/host) im Discord-Call, alle spielen am eigenen Handy mit.'
        : 'Spielt ihr verteilt per Discord/Video-Call? Dann „Remote“ wählen – die Karten passen sich an.'}</div>
    `)}
    ${S.phase === 'lobby' ? grp('wheel', '🎰 Glücksrad', 'Spiel / Spieler auslosen', `
      <div class="cats">
        <button class="active" onclick="socket.emit('host:spinWheel','mode')">🎰 Zufalls-Spiel drehen</button>
        <button class="active" ${S.players.length < 1 ? 'disabled style="opacity:.45"' : ''} onclick="socket.emit('host:spinWheel','player')">🎡 Spieler auslosen</button>
      </div>
    `) : ''}
    ${grp('players', '🙋 Spieler', `${S.players.length} Spieler${S.teamMode ? ' · Teams' : ''}`, `
      <div id="adminPlist" class="plist">${S.players.length ? S.players.map((p, i) => `
        <div class="prow">
          <span>${S.teamMode && p.team ? ({ red: '🔴', blue: '🔵', yellow: '🟡', green: '🟢', purple: '🟣', orange: '🟠', pink: '🩷', teal: '🩵' }[p.team] || '⚪') + ' ' : ''}${p.avatar ? esc(p.avatar) + ' ' : ''}${esc(p.name)}<span class="ansMark">${p.answered ? ' ✓' : ''}</span></span>
          <span><b>${p.score} Pkt</b><button class="kick" onclick="kick(${i})">✕</button></span>
        </div>`).join('') : '<div style="opacity:.6">Noch keine Spieler</div>'}
      </div>
    `)}`;
}
</script>
</body></html>
