<script>

};
const AVATARS = ['😎', '🦊', '🐼', '🐸', '🦁', '🦄', '🐙', '🐱', '🚀', '🌟', '🍕', '🔥', '🪅', '🤡', '🤪', '🥳', '👽', '👻', '💩', '🐵', '🦖', '🦩', '🦝', '🦆', '🦥', '🦫', '🍺', '🌮', '🪩', '🤖', '🧙', '🥷', '🧛', '🍌', '🧀', '🌵'];
const ROOM_CODE = (new URLSearchParams(location.search).get('room') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
let roomError = '';
const socket = ROOM_CODE ? pgConnect(ROOM_CODE, 'play') : { on(){}, emit(){}, timeout() { return this; } };
if (ROOM_CODE) {
  socket.on('room:error', (e) => {
    roomError = (e && e.error) || 'Raum nicht gefunden oder abgelaufen.';
    render();
  });
}
async function joinByRoomInput() {
  const inp = document.getElementById('roomCodeInp');
  const errEl = document.getElementById('roomErrMsg');
  const code = (inp ? inp.value : '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  if (!code) { if (errEl) errEl.textContent = 'Bitte einen Raumcode eingeben.'; return; }
  try {
    const res = await fetch('/api/rooms/' + encodeURIComponent(code));
    const d = await res.json();
    if (!d.exists) { if (errEl) errEl.textContent = 'Raum „' + code + '“ wurde nicht gefunden.'; return; }
    location.href = '/?room=' + encodeURIComponent(d.code);
  } catch {
    if (errEl) errEl.textContent = 'Verbindungsfehler beim Prüfen des Raums.';
  }
}
function copyInviteLink() {
  const link = (S && S.publicUrl) || (location.origin + '/?room=' + encodeURIComponent(ROOM_CODE));
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(() => {
      document.querySelectorAll('.copyInviteBtn').forEach(b => {
        b.textContent = '✅ Link kopiert!';
        setTimeout(() => { b.textContent = '📋 Einladungs-Link kopieren'; }, 2000);
      });
    }).catch(() => prompt('Einladungs-Link kopieren:', link));
  } else {
    prompt('Einladungs-Link kopieren:', link);
  }
}
function inviteBarHtml() {
  return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,211,61,0.1);border:1px solid rgba(255,211,61,0.35);border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:14px"><span>Raum: <b style="color:#ffd33d;letter-spacing:2px">${esc(ROOM_CODE)}</b></span><button type="button" class="copyInviteBtn" onclick="copyInviteLink()" style="background:#4b3a9e;color:#fff;padding:7px 12px;font-size:13px;font-weight:700;border-radius:8px;border:0;cursor:pointer">📋 Einladungs-Link kopieren</button></div>`;
}
async function createRoomFromHome(target) {
  try {
    const res = await fetch('/api/rooms', { method: 'POST' });
    const d = await res.json();
    if (d && d.code) {
      if (d.hostToken) localStorage.setItem('pg_host_' + d.code, d.hostToken);
      location.href = target + '?room=' + encodeURIComponent(d.code);
    }
  } catch {}
}
let S = null, P = null, joined = false, myAnswer = null, ansState = '', sortPicks = [], lastRoundKey = '', name = localStorage.getItem('qn') || '', avatar = localStorage.getItem('qa') || '😎', reconnectToken = localStorage.getItem('qt') || '';
const JOINED_KEY = 'pg_joined_' + ROOM_CODE;
let unconfirmed = null; // { rk, v } – Antwort ohne Bestätigung, wird nach Rejoin erneut gesendet
let localRevealed = false, localSecret = null, localImposterDone = [], localNameDraft = '', localActiveName = '';
let pWheelStop = () => {}, pActiveSpinId = -1;

function startPhoneWheelAnim(spin) {
  const cvs = document.getElementById('phoneWheelCanvas');
  if (!cvs || !spin || !Array.isArray(spin.items) || !spin.items.length) return;
  pWheelStop();
  pWheelStop = pgRunWheel(cvs, spin, {
    R: 0.42, cyOff: 8, rimPad: 9, rimLine: 3, sliceLine: 2, winLine: 5,
    font: N => (N > 12 ? 13 : N > 8 ? 15 : N > 5 ? 17 : 19), labelMax: 16, labelInset: 12,
    hubLine: 4, hubFont: 20, pins: false, shadow: false,
    ptr: { w: 13, h: 10, tip: 20, top: 12, line: 2.5 },
    onWin: label => {
      const wb = document.getElementById('phoneWheelWinner');
      if (wb) wb.innerHTML = `<div style="background:#26890c;border:2px solid #ffd33d;border-radius:14px;padding:10px 18px;font-size:22px;font-weight:900;display:inline-block;animation:popIn .3s ease-out both">🎉 ${esc(label)}</div>`;
    },
    isActive: () => !!(S && S.phase === 'spin' && S.spin && S.spin.id === spin.id),
  });
}
const playSongAudio = document.getElementById('playSongAudio');
playSongAudio.loop = true;
let playAudioOn = localStorage.getItem('qAudio') === '1', playAudioBlocked = false, playAudioError = false, playAudioElUnlocked = false, lastSongKey = '', songPlayingSent = '', clientDeadline = 0, clientTotalMs = 5000, lastPhoneSig = '', lastPhoneBaseSig = '';
let playVol = Number(localStorage.getItem('qVol') ?? 0.5);
if (!Number.isFinite(playVol) || playVol < 0 || playVol > 1) playVol = 0.5;
playSongAudio.volume = playVol;
playSongAudio.addEventListener('error', () => {
  if ((playSongAudio.getAttribute('src') || '').includes('/silent.mp3')) return;
  playAudioError = true; playAudioBlocked = false; render();
});
playSongAudio.addEventListener('playing', () => {
  if (S && S.mode === 'songquiz' && S.phase === 'question') {
    const sk = `${S.mode}:${S.idx}`;
    if (songPlayingSent !== sk) {
      songPlayingSent = sk;
      socket.emit('song:playing', S.idx);
    }
  }
});
for (const ev of ['progress', 'suspend']) playSongAudio.addEventListener(ev, () => { if (S && S.noTvMode && playAudioOn) pgPreloadNextAudio(S, playSongAudio); });
function setPlayVol(v) {
  playVol = Math.max(0, Math.min(1, Number(v) / 100));
  localStorage.setItem('qVol', String(playVol));
  playSongAudio.volume = playVol;
}
const app = document.getElementById('app');
const viewWrap = document.getElementById('viewWrap');
const viewPad = document.getElementById('viewPad');
const vctx = viewPad.getContext('2d');
const padWrap = document.getElementById('padWrap');
const pad = document.getElementById('pad');
const pctx = pad.getContext('2d');
let penColor = '#111', penWidth = 6, drawing = false, lastPt = null, strokeSeq = 0, curStrokeId = 0, localDrawStack = [];
let padRect = null, pendingChunk = null, chunkTimer = 0;
const CHUNK_MS = 50, CHUNK_MAX_PTS = 60;
const phoneLineWidth = w => Math.max(2, Math.round((w || 6) * 0.7));
// esc() is provided by /js/ux-helpers.js
let lastVibKey = '', phoneTickSec = -1;

function drawSeg(ctx, cvs, seg) {
  ctx.strokeStyle = seg.c || '#111';
  ctx.lineWidth = Math.max(2, Math.round((seg.w || 6) * 0.7));
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(seg.x0 * cvs.width, seg.y0 * cvs.height);
  ctx.lineTo(seg.x1 * cvs.width, seg.y1 * cvs.height);
  ctx.stroke();
}
socket.on('draw:clear', () => {
  vctx.clearRect(0, 0, viewPad.width, viewPad.height);
  pctx.clearRect(0, 0, pad.width, pad.height);
  localDrawStack = [];
});
socket.on('draw:stroke', ch => pgDrawChunk(vctx, viewPad, ch, phoneLineWidth(ch.w)));
socket.on('draw:history', list => {
  vctx.clearRect(0, 0, viewPad.width, viewPad.height);
  pctx.clearRect(0, 0, pad.width, pad.height);
  list.forEach(ch => { pgDrawChunk(vctx, viewPad, ch, phoneLineWidth(ch.w)); pgDrawChunk(pctx, pad, ch, phoneLineWidth(ch.w)); });
});
socket.on('react', r => {
  if (!r || !r.emoji) return;
  pgFloatEmoji(`<span class="emIcon" style="font-size:34px">${esc(r.emoji)}</span>${r.name ? `<small style="font-size:11px">${esc(r.avatar || '😎')} ${esc(r.name)}</small>` : ''}`, 10, 76);
});
let lastReactAt = 0;
function sendReact(em) {
  const now = Date.now();
  if (now - lastReactAt < 300) return;
  lastReactAt = now;
  socket.emit('player:react', em);
}

const pStreakTag = p => (p && p.streak >= 2)
  ? `<span class="streakBadge ${p.streak >= 3 ? 'hot' : ''}" style="font-size:12px;padding:1px 7px">🔥 ${p.streak}×</span>`

function renderEmojiBar() {
  const emojis = ['😂', '🔥', '💀', '🤡', '🍻', '❤️'];
  return `<div class="emojiBar">${emojis.map(em => `<button type="button" onclick="sendReact('${em}')">${em}</button>`).join('')}</div>`;
}

let pLastScoreAnimKey = '', pScoreRaf = 0;
function animatePhoneScores() {
  if (!S || S.phase !== 'result') return;
  const ak = `${S.mode}:${S.idx}:result`;
  const nodes = [...document.querySelectorAll('.scoreNum')];
  if (!nodes.length) return;
  if (ak === pLastScoreAnimKey) {
    nodes.forEach(n => { n.textContent = `${n.dataset.to} Pkt`; });
    return;
  }
  pLastScoreAnimKey = ak;
  cancelAnimationFrame(pScoreRaf);
  const start = performance.now();
  const dur = 750;
  function tick(now) {
    const t = Math.min(1, (now - start) / dur);
    const ease = 1 - Math.pow(1 - t, 3);
    nodes.forEach(n => {
      const from = Number(n.dataset.from) || 0;
      const to = Number(n.dataset.to) || 0;
      n.textContent = `${Math.round(from + (to - from) * ease)} Pkt`;
    });
    if (t < 1) pScoreRaf = requestAnimationFrame(tick);
  }
  pScoreRaf = requestAnimationFrame(tick);
}

function renderPhonePodium() {
  const list = (S.teamMode && S.teams && S.teams.length)
    ? S.teams.slice(0, 3).map(t => ({ label: t.label, score: t.score }))
    : S.players.slice(0, 3).map(p => ({ label: `${p.avatar || '😎'} ${p.name}`, score: p.score }));
  if (!list.length) return '';

function syncPlayAudio(s) {
  const songKey = `${s.mode}:${s.idx}`;
  if (!s.noTvMode || !playAudioOn || s.paused) {
    if (!playSongAudio.paused) playSongAudio.pause();
    if (!s.noTvMode || !playAudioOn) lastSongKey = '';
    return;
  }
  if (s.mode === 'songquiz' && s.phase === 'question' && s.q && s.q.preview) {
    if (songKey !== lastSongKey) {
      lastSongKey = songKey;
      playAudioBlocked = false;
      playAudioError = false;
      playAudioElUnlocked = true;
      playSongAudio.loop = true;
      playSongAudio.pause();
      playSongAudio.src = s.q.preview;
      playSongAudio.load();
      playSongAudio.volume = playVol;
      const pr = playSongAudio.play();
      if (pr && pr.catch) pr.catch(() => { if (!playAudioError) playAudioBlocked = true; render(); });
    } else {
      playSongAudio.volume = playVol;
      if (playSongAudio.paused && !playAudioBlocked && !playAudioError) {
        playSongAudio.play().catch(() => { if (!playAudioError) playAudioBlocked = true; render(); });
      }
    }
  } else if (s.mode === 'songquiz' && s.phase === 'result') {
    playSongAudio.volume = playVol; // Song läuft in der Auflösung mit unveränderter Lautstärke weiter
  } else if (s.mode !== 'songquiz' || s.phase === 'lobby' || s.phase === 'end') {
    lastSongKey = '';
    playAudioBlocked = false;
    playAudioError = false;
    if (!playSongAudio.paused) playSongAudio.pause();
  }
}

function togglePlayAudio(retryOnly = false) {
  if (!retryOnly) {
    playAudioOn = !playAudioOn;
    localStorage.setItem('qAudio', playAudioOn ? '1' : '0');
  }
  playAudioBlocked = false;
  playAudioError = false;
  lastSongKey = '';
  if (playAudioOn && !playAudioElUnlocked && !playSongAudio.getAttribute('src')) {
    playAudioElUnlocked = true;
    playSongAudio.loop = false;
    playSongAudio.muted = true;
    playSongAudio.src = '/silent.mp3';
    const pr = playSongAudio.play();
    if (pr && pr.then) {
      pr.then(() => {
        if ((playSongAudio.getAttribute('src') || '').includes('/silent.mp3')) {
          playSongAudio.pause();
          playSongAudio.removeAttribute('src');
          playSongAudio.load();
          playSongAudio.loop = true;
          playSongAudio.muted = false;
        }
      }).catch(() => {
        playAudioElUnlocked = false;
        playSongAudio.loop = true;
        playSongAudio.muted = false;
      });
    }
  }
  if (!playAudioOn && !playSongAudio.paused) playSongAudio.pause();

function pt(e) {
  const r = padRect || pad.getBoundingClientRect();
  return { x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) };
}
const q1000 = v => Math.round(v * 1000);
function flushChunk() {
  clearTimeout(chunkTimer);
  chunkTimer = 0;
  if (!pendingChunk || pendingChunk.p.length < 4) return;
  socket.emit('draw:stroke', pendingChunk);
  const p = pendingChunk.p;
  // Nächster Chunk startet am letzten Punkt, damit die Linie lückenlos bleibt
  pendingChunk = { sid: pendingChunk.sid, c: pendingChunk.c, w: pendingChunk.w, p: [p[p.length - 2], p[p.length - 1]] };
}
function endStroke() {
  drawing = false; lastPt = null; padRect = null;
  flushChunk();
  pendingChunk = null;
  if (localDrawStack.length && !localDrawStack[localDrawStack.length - 1].length) localDrawStack.pop();
}
pad.addEventListener('pointerdown', e => {
  drawing = true;
  padRect = pad.getBoundingClientRect();
  lastPt = pt(e);
  curStrokeId = ++strokeSeq;
  localDrawStack.push([]);
  pendingChunk = (!S || S.displayMode !== 'onedevice')
    ? { sid: curStrokeId, c: penColor, w: penWidth, p: [q1000(lastPt.x), q1000(lastPt.y)] }
    : null;
  pad.setPointerCapture(e.pointerId);
});
pad.addEventListener('pointermove', e => {
  if (!drawing || !lastPt) return;
  const cur = pt(e);
  const seg = { x0: lastPt.x, y0: lastPt.y, x1: cur.x, y1: cur.y, c: penColor, w: penWidth, sid: curStrokeId };
  drawSeg(pctx, pad, seg);
  if (localDrawStack.length) localDrawStack[localDrawStack.length - 1].push(seg);
  lastPt = cur;
  if (!pendingChunk) return;
  const p = pendingChunk.p, qx = q1000(cur.x), qy = q1000(cur.y);
  if (p[p.length - 2] === qx && p[p.length - 1] === qy) return;
  p.push(qx, qy);
  if (p.length >= CHUNK_MAX_PTS * 2) flushChunk();
  else if (!chunkTimer) chunkTimer = setTimeout(flushChunk, CHUNK_MS);
});
pad.addEventListener('pointerup', endStroke);

      <button id="localStartBtn" class="go" ${S.players.length < 1 ? 'disabled' : ''} onclick="socket.emit('host:start')">▶ Spiel starten (${S.players.length} Spieler)</button>`;
    return;
  }

  if (S.phase === 'end') {
    const awardsHtml = S.awards && S.awards.length
      ? `<div class="resBox"><div class="resTitle">🏅 Auszeichnungen</div>${S.awards.map(a => `<div class="resRow"><span>${a.icon} ${esc(a.title)}</span><b>${esc(a.name)} (${esc(a.detail)})</b></div>`).join('')}</div>`
      : '';
    app.innerHTML = `${ctrlBar}<div class="msg" style="margin-top:2vh">Spiel vorbei! 🎉</div>${awardsHtml}${renderLb('🏆 Endstand')}
      <button class="go" onclick="socket.emit('host:start')">🔄 Nochmal spielen</button>
      <button class="go" style="background:#4b3a9e" onclick="socket.emit('host:reset')">🏠 Zur Lobby</button>`;
    return;
  }

  const top = `${ctrlBar}<div class="bar"><div id="pbar" style="width:100%"></div></div><div>Runde ${S.idx + 1}/${S.total} &nbsp; <b id="psec"></b></div>` +

    renderMissionBanner();

  if (S.phase === 'result') {
    app.innerHTML = `${top}${renderPhoneResult()}<button class="go" onclick="socket.emit('host:next')">▶ Nächste Runde</button>`;
    return;
  }

  if (S.mode === 'reaction') {
    app.innerHTML = `${top}<div class="msg">⚡ Reaktions-Buzzer braucht mehrere Handys.<br><small>Überspringe diese Runde.</small></div><button class="go" onclick="socket.emit('host:next')">⏭ Nächste Runde</button>`;
    return;
  }

  if (S.phase === 'discuss' && S.mode === 'imposter') {
    const nextP = S.players.find(p => !localImposterDone.includes(p.name));
    if (!nextP) {
      app.innerHTML = `${top}<div class="msg">💬 Alle kennen ihr Wort!<br><small>Gebt reihum einen Hinweis.</small></div><button class="go" onclick="socket.emit('host:next')">🗳 Abstimmung starten</button>`;
    } else if (!localRevealed) {
      localActiveName = nextP.name;
      app.innerHTML = `${top}<div class="msg">📱 Gib das Gerät an<br><b>${esc(nextP.avatar)} ${esc(nextP.name)}</b></div><button class="go" onclick="revealLocal(true)">👁️ Ich bin ${esc(nextP.name)} (Wort zeigen)</button>`;
    } else {
      localActiveName = nextP.name;
      app.innerHTML = `${top}<div class="qtxt">${esc(nextP.name)}, dein geheimes Wort:</div><div class="wordBox">${esc((localSecret && localSecret.word) || '')}</div><button class="go" onclick="doneImposterRead()">✅ Gelesen & Weitergeben</button>`;
    }
    return;
  }

  if (S.phase === 'write' && S.mode === 'truthlie' && S.q) {
    const st = S.q.storyteller;
    localActiveName = st;
    if (!localRevealed) {
      app.innerHTML = `${top}<div class="msg">📱 Gib das Gerät an<br><b>🎭 ${esc(st)}</b></div><button class="go" onclick="revealLocal(false)">✍️ Ich bin ${esc(st)}</button>`;
    } else {
      app.innerHTML = `${top}<div class="qtxt">🎭 ${esc(st)}: 2 Wahrheiten & 1 Lüge</div>

    return;
  }

  if (S.mode === 'draw' && S.q) {
    localActiveName = S.q.drawer;
    if (!localRevealed) {
      app.innerHTML = `${top}<div class="msg">📱 Gib das Gerät an<br><b>🎨 ${esc(S.q.drawer)}</b></div><button class="go" onclick="revealLocal(true)">🎨 Ich bin ${esc(S.q.drawer)} (Wort zeigen)</button>`;

        <div class="votes">${S.players.map((p, i) => p.name !== S.q.drawer ? `<button onclick="socket.emit('local:wordGuessed',S.players[${i}]?.name)">✅ ${esc(p.name)}</button>` : '').join('')}</div>
        <button class="go" style="background:#555;margin-top:8px" onclick="socket.emit('local:wordGuessed',null)">⏭ Niemand</button>`;
    }
    return;
  }

  if (S.mode === 'taboo' && S.q) {
    localActiveName = S.q.explainer;
    if (!localRevealed) {
      app.innerHTML = `${top}<div class="msg">📱 Gib das Gerät an<br><b>🗣️ ${esc(S.q.explainer)}</b></div><button class="go" onclick="revealLocal(true)">🗣️ Ich bin ${esc(S.q.explainer)} (Wort zeigen)</button>`;
    } else {
      const taboos = ((localSecret && localSecret.taboo) || []).map(w => `<span class="resChip" style="background:#e21b3c">${esc(w)}</span>`).join('');
      app.innerHTML = `${top}<div class="qtxt">🗣️ Erkläre:</div><div class="wordBox">${esc((localSecret && localSecret.word) || '')}</div>
        <div class="resChips" style="margin:8px 0">${taboos}</div>
        <div style="font-size:13px;opacity:.8;margin:10px 0 4px">Wer hat's erraten?</div>
        <div class="votes">${S.players.map((p, i) => p.name !== S.q.explainer ? `<button onclick="socket.emit('local:wordGuessed',S.players[${i}]?.name)">✅ ${esc(p.name)}</button>` : '').join('')}</div>
        <button class="go" style="background:#555;margin-top:8px" onclick="socket.emit('local:wordGuessed',null)">⏭ Niemand</button>`;
    }
    return;
  }

  const cur = S.players.find(p => !p.answered && !(S.mode === 'truthlie' && S.q && p.name === S.q.storyteller));
  if (!cur) {
    app.innerHTML = `${top}<div class="msg">⏳ Auswertung…</div>`;
    return;
  }
  localActiveName = cur.name;
  if (!localRevealed) {
    app.innerHTML = `${top}${S.mode === 'songquiz' ? renderAudioControls(false) : ''}<div class="msg">📱 Gib das Gerät an<br><b>${esc(cur.avatar)} ${esc(cur.name)}</b></div><button class="go" onclick="revealLocal(false)">👁️ Ich bin ${esc(cur.name)}</button>`;
    return;
  }

  const pn = esc(cur.name);
  const turnHdr = `${top}<div style="font-size:14px;color:#ffd33d;font-weight:700;margin-bottom:6px">Am Zug: ${esc(cur.avatar)} ${pn}</div>`;
  if (S.mode === 'quiz' || S.mode === 'teams' || S.mode === 'songquiz' || S.mode === 'imagequiz') {
    const minH = S.q.a.length > 4 ? '11vh' : '14vh';
    const iqImg = S.q && S.q.img ? `<div style="text-align:center;margin:8px 0 10px"><img src="${esc(S.q.img)}" style="max-height:24vh;max-width:84vw;border-radius:12px;object-fit:contain;${['logos', 'cars', 'countries'].includes(S.q.theme) ? 'background:#fff;padding:12px;width:140px;height:140px;' : ''}"></div>` : '';
    app.innerHTML = `${turnHdr}${S.mode === 'songquiz' ? renderAudioControls(false) : ''}<div class="qtxt">${esc(S.q.q)}</div>${iqImg}<div class="grid">${S.q.a.map((a, i) => `<button class="c${i}" style="font-size:16px;min-height:${minH}" onclick="submitLocal(${i})">${esc(a)}</button>`).join('')}</div>`;
  } else if (S.mode === 'mostlikely' || S.mode === 'imposter') {
    app.innerHTML = `${turnHdr}<div class="qtxt">${esc(S.q.q)}</div><div class="votes">${S.players.map((p, i) => `<button onclick="submitLocalVote(${i})">${esc(p.name)}</button>`).join('')}</div>`;
  } else if (S.mode === 'wouldyourather') {
    app.innerHTML = `${turnHdr}<div class="wyr"><button class="c0" onclick="submitLocal(0)">${esc(S.q.a)}</button><button class="c1" onclick="submitLocal(1)">${esc(S.q.b)}</button></div>`;
  } else if (S.mode === 'estimate') {
    app.innerHTML = `${turnHdr}<div class="qtxt">${esc(S.q.q)}</div><input id="est" type="number" inputmode="decimal" placeholder="Deine Zahl"><button class="go" onclick="submitLocalEst()">Absenden</button>`;
  } else if (S.mode === 'neverhavei') {
    app.innerHTML = `${turnHdr}<div class="qtxt">${esc(S.q.q)}</div><div class="wyr"><button class="c0" onclick="submitLocal(true)">🙌 Hab ich schon</button><button class="c3" onclick="submitLocal(false)">😇 Noch nie</button></div>`;
  } else if (S.mode === 'icebreaker') {
    app.innerHTML = `${turnHdr}<div class="qtxt">${esc(S.q.q)}</div><input id="iceIn" maxlength="120" placeholder="Deine Antwort…"><button class="go" onclick="submitLocalIce()">Absenden</button>`;
  } else if (S.mode === 'scale') {
    app.innerHTML = `${turnHdr}<div class="qtxt">${esc(S.q.q)}</div><div style="font-size:42px;font-weight:900;color:#ffd33d;margin:10px 0" id="scVal">5</div>
      <input id="scIn" type="range" min="1" max="10" value="5" style="width:100%;accent-color:#ffd33d" oninput="document.getElementById('scVal').textContent=this.value">
      <div style="display:flex;justify-content:space-between;font-size:13px;opacity:.85;margin-bottom:12px"><span>1: ${esc(S.q.min)}</span><span>10: ${esc(S.q.max)}</span></div>
      <button class="go" onclick="submitLocalScale()">Absenden</button>`;
  } else if (S.mode === 'truthlie') {
    app.innerHTML = `${turnHdr}<div class="qtxt">Was ist die Lüge von ${esc(S.q.storyteller)}?</div><div class="wyr">${S.q.statements.map((st, i) => `<button class="c${i}" style="min-height:12vh;font-size:17px" onclick="submitLocal(${i})">${esc(st)}</button>`).join('')}</div>`;
  } else if (S.mode === 'wordassoc') {
    app.innerHTML = `${turnHdr}<div class="qtxt" style="font-size:28px">⚡ ${esc(S.q.w)}</div><input id="waIn" maxlength="30" placeholder="Erstes Wort…"><button class="go" onclick="submitLocalAssoc()">Absenden</button>`;
  } else if (S.mode === 'sort' && S.q) {
    const btns = S.q.items.map(it => {
      const orderNum = sortPicks.indexOf(it.idx) + 1;
      return `<button type="button" onclick="pickSort(${it.idx})" style="width:100%;margin:5px 0;padding:13px;font-size:15px;text-align:left;display:flex;justify-content:space-between;align-items:center;background:${orderNum ? '#7c4dff' : '#2d2266'};border:2px solid ${orderNum ? '#ffd33d' : 'transparent'}">
        <span>${esc(it.label)}</span><b>${orderNum ? `#${orderNum}` : 'Antippen'}</b></button>`;
    }).join('');
    app.innerHTML = `${turnHdr}<div class="qtxt">${esc(S.q.q)}</div>${btns}<button class="go" ${sortPicks.length < 4 ? 'disabled style="opacity:.45"' : ''} onclick="if(sortPicks.length===4)submitLocal(sortPicks.slice())">Absenden (${sortPicks.length}/4)</button>`;
  }
}

// Hält Zusatz-Boxen (Status, Ändern, Überspringen) unterhalb des Antwortbereichs in fester Reihenfolge:
// neu angelegte Boxen werden vor das erste vorhandene Element aus `before` (direkte Kinder von #app) gesetzt.
function syncBox(id, show, marginTop, html, before = []) {
  let el = document.getElementById(id);
  if (!show) {
    if (el) el.remove();
    return;
  }
  if (!el) {
    el = document.createElement('div');
    el.id = id;
    el.style.marginTop = marginTop;
    let ref = null;
    for (const sel of before) { ref = app.querySelector(`:scope > ${sel}`); if (ref) break; }
    app.insertBefore(el, ref);
  }
  if (el.innerHTML !== html) el.innerHTML = html;
}

// Phasenwechsel (Frage → Auflösung → nächste Runde) weich überblenden; gleiche Phase rendert sofort
function render() {
  pgTransition(S && joined ? `${S.mode}:${S.idx}:${S.phase}` : 'setup', renderNow);
}
function renderNow() {
  const activeEl = document.activeElement;
  if (S && (S.phase === 'question' || S.phase === 'write') && activeEl && activeEl.tagName === 'INPUT' && activeEl.type !== 'range' && app.contains(activeEl)) {
    updatePhoneTimerUI();
    return;
  }
  renderView();
  // Reihenfolge: Status-Pille (primäres Feedback) → „Antwort ändern“ (dezent) → Überspringen (sekundär) → Emoji-Leiste
  const ansMsg = {
    pending: '⏳ Antwort wird gesendet…',
    ok: '✅ Antwort ist angekommen',
    unsure: '⚠️ Schwaches Netz – Antwort wird nachgesendet',
    rejected: '↩️ Nicht angekommen – bitte nochmal tippen',
    late: '⏰ Antwort kam zu spät an',
  }[ansState];
  const showAns = Boolean(joined && S && S.phase === 'question' && S.displayMode !== 'onedevice' && ansMsg && (myAnswer !== null || ansState === 'rejected'));
  syncBox('ansStateBox', showAns, '14px', `<div class="ansState ${ansState}" role="status">${ansMsg}</div>`, ['#editAnsBox', '#skipVoteBox', '.emojiBar']);
  const showEdit = Boolean(joined && S && S.displayMode !== 'onedevice' && S.phase === 'question' && myAnswer !== null && S.mode !== 'reaction');
  syncBox(
    'editAnsBox',
    showEdit,
    '4px',
    `<button type="button" class="linkBtn" onclick="editAnswer()">✏️ Antwort ändern</button>`,
    ['#skipVoteBox', '.emojiBar']
  );
  const showSkip = Boolean(joined && S && S.displayMode !== 'onedevice' && S.skipVote);
  let skipHtml = '';
  if (showSkip) {
    const sv = S.skipVote;
    const iVoted = Array.isArray(sv.voters) && sv.voters.includes(name.toLowerCase());
    const label = iVoted ? '✅ Weiter-Stimme aktiv' : (S.phase === 'result' ? '⏭️ Sofort weiter' : '⏭️ Runde überspringen');
    skipHtml = `<button type="button" class="ghostBtn${iVoted ? ' on' : ''}" onclick="socket.emit('player:skipVote')">${label} (${sv.count}/${sv.needed})</button>`;
  }
  syncBox('skipVoteBox', showSkip, '10px', skipHtml, ['.emojiBar']);
  updatePhoneTimerUI();
  animatePhoneScores();
}

function renderView() {
  if (!ROOM_CODE || roomError) {
    lastPhoneSig = '';
    lastPhoneBaseSig = '';
    padWrap.style.display = 'none';
    viewWrap.style.display = 'none';
    app.innerHTML = `
      <div class="card" style="max-width:420px;margin:20px auto;text-align:center">
        <h2 style="margin-top:0">🎉 PartyGame</h2>
        ${roomError ? `<div style="background:rgba(226,27,60,.18);border:1px solid #e21b3c;color:#ff8fa3;padding:10px;border-radius:10px;margin-bottom:12px;font-weight:700">${esc(roomError)}</div>` : '<p style="opacity:.85;margin-top:0">Gib den Raumcode ein oder erstelle eine neue Party-Lobby.</p>'}
        <input id="roomCodeInp" placeholder="Raumcode (z. B. K7M2)" maxlength="6" style="text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:4px;font-weight:800;margin-bottom:10px" onkeydown="if(event.key==='Enter')joinByRoomInput()">

        <button type="button" style="width:100%;background:#1368ce;padding:12px;font-size:16px;font-weight:700" onclick="createRoomFromHome('/host')">📺 Neuen Raum erstellen</button>
      </div>`;
    return;
  }
  if (S && S.displayMode === 'onedevice') { lastPhoneSig = ''; lastPhoneBaseSig = ''; return renderOneDevice(); }
  if (!joined) {
    lastPhoneSig = '';
    lastPhoneBaseSig = '';
    padWrap.style.display = 'none';
    viewWrap.style.display = 'none';
    const avs = AVATARS.map(a => `<button type="button" class="avBtn${a === avatar ? ' on' : ''}" aria-pressed="${a === avatar}" onclick="pickAv('${a}')">${a}</button>`).join('');
    const avGrid = document.getElementById('avGrid');
    if (avGrid && document.getElementById('n')) {
      const sl = avGrid.scrollLeft;
      avGrid.innerHTML = avs;
      avGrid.scrollLeft = sl;
      return;
    }
    app.innerHTML = `<h1>🎉 PartyGame</h1>${inviteBarHtml()}
      <div class="joinLbl">Wie heißt du?</div>
      <input id="n" maxlength="16" placeholder="Dein Name" autocomplete="nickname" enterkeyhint="go" value="${esc(name)}" oninput="name=this.value;updJoinBtn()" onkeydown="if(event.key==='Enter'){event.preventDefault();join()}">
      <div class="joinLbl">Dein Avatar <span style="font-weight:400;opacity:.75">– wischen für mehr →</span></div>
      <div id="avGrid" role="group" aria-label="Avatar wählen">${avs}</div>
      <div class="err" id="e"></div>
      <button class="go" id="joinBtn" ${name.trim() ? '' : 'disabled'} onclick="join()">Mitspielen</button>`;
    // Gewählten Avatar in die Mitte des Streifens holen
    const grid = document.getElementById('avGrid'), sel = grid && grid.querySelector('.avBtn.on');
    if (grid && sel) grid.scrollLeft = sel.offsetLeft - (grid.clientWidth - sel.offsetWidth) / 2;
    return;
  }
  if (!S) return;
  const isDrawer = S.mode === 'draw' && S.phase === 'question' && P && P.drawer;
  padWrap.style.display = isDrawer ? 'flex' : 'none';
  viewWrap.style.display = (S.noTvMode && S.mode === 'draw' && S.phase === 'question' && !isDrawer && !S.paused) ? 'block' : 'none';
  const mr = S.missionReveal;
  const audioSig = (S.noTvMode && (S.phase === 'lobby' || S.mode === 'songquiz'))
    ? `${playAudioOn}:${playAudioBlocked}:${playAudioError}:${Math.round(playVol * 100)}:${S.q && S.q.preview ? 1 : 0}`
    : '';
  const needPlayers = S.phase === 'lobby' || S.phase === 'result' || S.phase === 'end' || S.mode === 'mostlikely' || S.mode === 'imposter';
  const playersSig = needPlayers ? (S.players || []).map(p => `${p.name}:${p.avatar || ''}:${p.team || ''}:${p.score}`).join(',') : '';
  const guessMask = ((S.mode === 'draw' || S.mode === 'taboo') && S.phase === 'question' && S.q && S.q.mask) ? S.q.mask : '';
  const phoneBaseSig = [
    S.mode, S.idx, S.phase, S.paused, S.displayMode, S.teamMode, S.isFinalRound,
    isDrawer ? 1 : 0,
    JSON.stringify(myAnswer),
    S.mode === 'sort' ? sortPicks.join(',') : '',
    P ? JSON.stringify(P) : '',
    audioSig,
    mr ? `${mr.resolved}:${mr.success}` : '',
    S.phase === 'lobby' ? `${S.lobbyBanner || ''}:${avatar}:${avPickerOpen ? 1 : 0}:${S.isMix ? 1 : 0}` : '',
    S.phase === 'spin' && S.spin ? S.spin.id : '',

  ].join('|');

    renderMissionBanner();

  if (S.phase !== 'spin') {
    pActiveSpinId = -1;

  if (S.phase === 'spin' && S.spin) {
    padWrap.style.display = 'none';
    viewWrap.style.display = 'none';
    if (pActiveSpinId === S.spin.id && document.getElementById('phoneWheelCanvas')) return;
    pActiveSpinId = S.spin.id;
    app.innerHTML = `
      ${S.spin.subtitle ? `<div style="font-size:13px;opacity:.8;margin-top:6px">${esc(S.spin.subtitle)}</div>` : ''}
      <div class="qtxt" style="font-size:22px;color:#ffd33d;margin:6px 0 10px">${esc(S.spin.title || '🎡 Drehrad')}</div>

      <div id="phoneWheelWinner" style="min-height:50px;margin-top:12px"></div>`;

  if (S.phase === 'lobby') {

    const teamDefs = [
      ['red', '🔴 Rot', '#e21b3c'],
      ['blue', '🔵 Blau', '#1368ce'],
      ['yellow', '🟡 Gelb', '#d89e00'],
      ['green', '🟢 Grün', '#26890c'],
      ['purple', '🟣 Lila', '#7c4dff'],
      ['orange', '🟠 Orange', '#e86c00'],
      ['pink', '🩷 Pink', '#d81b60'],
      ['teal', '🩵 Türkis', '#00897b'],
    ];
    const teamPick = S.teamMode

         <div class="grid" style="margin-top:0">${teamDefs.map(([id, lbl, bg]) =>
           `<button style="background:${bg};min-height:8vh;font-size:16px;border:3px solid ${meTeam === id ? '#fff' : 'transparent'};opacity:${meTeam && meTeam !== id ? '.55' : '1'}" onclick="socket.emit('player:team','${id}')">${lbl}${meTeam === id ? ' ✓' : ''}</button>`
         ).join('')}</div></div>`
      : '';
    const lobbyBan = S.lobbyBanner ? `<div style="background:#26890c;border:2px solid #ffd33d;border-radius:12px;padding:10px 14px;font-weight:800;font-size:17px;margin-top:12px">${esc(S.lobbyBanner)}</div>` : '';
    const lobbyMode = S.isMix ? 'mix' : S.mode;
    const rules = RULES[lobbyMode] ? `<div class="lobbyRules"><b>So geht's:</b> ${esc(RULES[lobbyMode])}</div>` : '';
    const avPicker = avPickerOpen
      ? `<div class="avPick" role="group" aria-label="Avatar wählen">${AVATARS.map(a => `<button type="button" class="avBtn${a === avatar ? ' on' : ''}" aria-pressed="${a === avatar}" onclick="changeAv('${a}')">${a}</button>`).join('')}</div>`
      : '';
    const teamEmoji = Object.fromEntries(teamDefs.map(([id, lbl]) => [id, lbl.split(' ')[0]]));
    const plist = S.players || [];
    const chips = plist.map(p => `<span class="pChip${p.name === name ? ' me' : ''}">${S.teamMode && teamEmoji[p.team] ? `${teamEmoji[p.team]} ` : ''}${esc(p.avatar || '😎')} ${esc(p.name)}${p.name === name ? ' (du)' : ''}</span>`).join('');
    const playersBox = `<div class="lobbyCard"><div style="font-size:14px;font-weight:800;opacity:.85">👥 Dabei (${plist.length})</div><div class="pChips">${chips}</div></div>`;
    app.innerHTML = `${inviteBarHtml()}
      <div class="lobbyHi"><span class="lobbyAv">${esc(avatar)}</span><div><div class="lobbyName">Hi ${esc(name)}! 👋</div><button type="button" class="linkBtn" style="padding:2px 0" aria-expanded="${avPickerOpen}" onclick="toggleAvPicker()">${avPickerOpen ? '✕ Schließen' : '🎭 Avatar ändern'}</button></div></div>
      ${avPicker}${lobbyBan}
      <div class="lobbyCard"><div class="lobbyMode">${NAMES[lobbyMode] || esc(lobbyMode)}${S.teamMode ? ' · 👥 Team-Spiel' : ''}</div>${rules}</div>
      <div class="lobbyWait">⏳ Warte auf den Start…</div>
      ${renderAudioControls(true)}${teamPick}${playersBox}${renderEmojiBar()}`;
    return;
  }

  if (S.phase === 'end') {
    const rank = S.players.findIndex(p => p.name === name) + 1;
    const awardsHtml = S.awards && S.awards.length
      ? `<div class="resBox"><div class="resTitle">🏅 Auszeichnungen</div>${S.awards.map(a => `<div class="resRow"><span>${a.icon} ${esc(a.title)}</span><b>${esc(a.name)} (${esc(a.detail)})</b></div>`).join('')}</div>`
      : '';
    app.innerHTML = `<div class="msg" style="margin-top:2vh">Spiel vorbei! Platz ${rank} 🎉<br><small>${me ? me.score : 0} Punkte</small></div>${renderPhonePodium()}${awardsHtml}${renderLb('🏆 Endstand')}${renderEmojiBar()}`;
    const endVib = `end:${S.mode}`;
    if (lastVibKey !== endVib) {
      lastVibKey = endVib;
      if (rank >= 1 && rank <= 3) { pgConfetti(rank === 1 ? 110 : 60); pgVibrate([30, 60, 30, 60, 80]); }
    }
    return;
  }

  if (S.paused && S.phase !== 'lobby' && S.phase !== 'end') {
    padWrap.style.display = 'none';
    app.innerHTML = `${top}<div class="msg">⏸ Pause<br><small>Gleich geht's weiter…</small></div>`;
    return;
  }

  if (S.phase === 'discuss' && S.mode === 'imposter') {
    const w = P && P.word ? P.word : '…';
    app.innerHTML = `${top}<div class="qtxt">Dein geheimes Wort:</div><div class="wordBox">${esc(w)}</div><p>Sag reihum einen Hinweis – verrate das Wort nicht!</p>`;
    return;
  }

  if (S.phase === 'write' && S.mode === 'truthlie') {
    if (S.q && S.q.storyteller === name) {
      app.innerHTML = `${top}<div class="qtxt">🎭 Du bist dran!<br><small>Schreib 2 Wahrheiten & 1 Lüge über dich:</small></div>
        <input id="tl1" maxlength="90" placeholder="✅ Wahrheit 1">
        <input id="tl2" maxlength="90" placeholder="✅ Wahrheit 2">
        <input id="tl3" maxlength="90" placeholder="🚨 Deine Lüge">
        <div class="err" id="tlFb"></div>
        <button class="go" onclick="sendTL()">Absenden</button>`;
    } else {
      app.innerHTML = `${top}<div class="msg">🎭 ${esc(S.q ? S.q.storyteller : '')} denkt sich gerade 2 Wahrheiten & 1 Lüge aus…</div>`;
    }
    return;
  }

  if (S.mode === 'reaction' && (S.phase === 'wait' || S.phase === 'go')) {
    if (S.phase === 'go' && myAnswer === null) {
      const vk = `react:${S.round}:${S.phase}`;
      if (lastVibKey !== vk) { lastVibKey = vk; pgVibrate([40, 30, 60]); }
    }
    const cls = S.phase === 'go' ? 'go' : 'wait';
    const txt = myAnswer === 'early' ? '❌ ZU FRÜH!' : myAnswer === 'go' ? '✅ GEDRÜCKT!' : S.phase === 'go' ? '⚡ JETZT!' : '⏳ WARTEN…';
    app.innerHTML = `${top}<button class="buzzer ${cls}" ${myAnswer !== null ? 'disabled' : ''} onpointerdown="buzz()">${txt}</button>`;
    return;
  }

  if (S.phase === 'question') {
    if (S.mode === 'quiz' || S.mode === 'imagequiz') {
      if (S.noTvMode && S.q) {
        const iqImg = S.q.img ? `<div style="text-align:center;margin:8px 0 10px"><img src="${esc(S.q.img)}" style="max-height:24vh;max-width:84vw;border-radius:12px;object-fit:contain;${['logos', 'cars', 'countries'].includes(S.q.theme) ? 'background:#fff;padding:12px;width:140px;height:140px;' : ''}"></div>` : '';
        app.innerHTML = `${top}<div class="qtxt">${esc(S.q.q)}</div>${iqImg}<div class="grid">${S.q.a.map((a, i) => `<button class="c${i}" style="font-size:16px;min-height:14vh" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(${i})">${['▲', '◆', '●', '■'][i]} ${esc(a)}${myAnswer === i ? ' ✓' : ''}</button>`).join('')}</div>`;
      } else {
        const tvHint = !S.noTvMode ? '<div class="tvHint">👀 Frage & Antworten stehen auf dem TV</div>' : '';
        app.innerHTML = `${top}${tvHint}<div class="grid">${S.q.a.map((_, i) => `<button class="c${i}" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(${i})">${['▲', '◆', '●', '■'][i]}${myAnswer === i ? ' ✓' : ''}</button>`).join('')}</div>`;
      }
    } else if (S.mode === 'mostlikely' || S.mode === 'imposter') {
      app.innerHTML = `${top}<div class="qtxt">${esc(S.q.q)}</div><div class="votes">${S.players.map((p, i) => `<button class="${myAnswer === p.name ? 'picked' : ''}" ${myAnswer !== null ? 'disabled' : ''} onclick="vote(${i})"><span style="font-size:24px;vertical-align:middle;margin-right:8px">${esc(p.avatar || '😎')}</span>${esc(p.name)}${myAnswer === p.name ? ' ✓' : ''}</button>`).join('')}</div>`;
    } else if (S.mode === 'wouldyourather') {
      app.innerHTML = `${top}<div class="wyr">
        <button class="c0" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(0)">${esc(S.q.a)}${myAnswer === 0 ? ' ✓' : ''}</button>
        <button class="c1" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(1)">${esc(S.q.b)}${myAnswer === 1 ? ' ✓' : ''}</button>
      </div>`;
    } else if (S.mode === 'estimate') {
      app.innerHTML = myAnswer !== null
        ? `${top}<div class="msg">Tipp abgegeben: <b>${myAnswer}</b> ✅</div>`
        : `${top}<div class="qtxt">${esc(S.q.q)}</div><input id="est" type="number" inputmode="decimal" placeholder="Deine Zahl"><button class="go" onclick="sendEst()">Absenden</button>`;
    } else if (S.mode === 'neverhavei') {
      app.innerHTML = `${top}<div class="qtxt">${esc(S.q.q)}</div><div class="wyr">
        <button class="c0" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(true)">🙌 Hab ich schon${myAnswer === true ? ' ✓' : ''}</button>
        <button class="c3" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(false)">😇 Noch nie${myAnswer === false ? ' ✓' : ''}</button>
      </div>`;
    } else if (S.mode === 'draw') {
      if (P && P.guessed) {
        app.innerHTML = `${top}<div class="msg">✅ Erraten!<br><small>Warte auf die anderen…</small></div>`;
      } else {
        const maskHtml = pgRenderWordMask(S.q.mask || '_'.repeat(S.q.len || 0));
        app.innerHTML = `${top}<div class="qtxt">Was malt ${esc(S.q.drawer)}?</div>
          <div id="drawMask" class="wordMask" style="font-size:24px">${maskHtml}</div>
          <input id="gIn" placeholder="Dein Tipp…" onkeydown="if(event.key==='Enter')sendGuess()">
          <button class="go" onclick="sendGuess()">Raten</button><div class="err" id="gFb"></div>`;
      }
    } else if (S.mode === 'taboo') {
      if (P && P.explainer) {
        const taboos = (P.taboo || []).map(w => `<span class="resChip" style="background:#e21b3c">${esc(w)}</span>`).join('');
        app.innerHTML = `${top}<div class="qtxt">🗣️ Erkläre dieses Wort:</div><div class="wordBox">${esc(P.word || '')}</div>
          <div style="font-size:14px;opacity:.85;margin:10px 0 6px">🚫 Verbotene Wörter:</div><div class="resChips">${taboos}</div>`;
      } else if (P && P.guessed) {
        app.innerHTML = `${top}<div class="msg">✅ Erraten!<br><small>Warte auf die anderen…</small></div>`;
      } else {
        const maskHtml = pgRenderWordMask(S.q.mask || '_'.repeat(S.q.len || 0));
        app.innerHTML = `${top}<div class="qtxt">🗣️ ${esc(S.q.explainer)} erklärt! (${S.q.len} Zeichen)</div>
          <div id="tabooMask" class="wordMask" style="font-size:24px">${maskHtml}</div>
          <input id="tIn" placeholder="Dein Tipp…" onkeydown="if(event.key==='Enter')sendTabooGuess()">
          <button class="go" onclick="sendTabooGuess()">Raten</button><div class="err" id="tFb"></div>`;
      }
    } else if (S.mode === 'sort' && S.q) {
      if (myAnswer !== null) {
        app.innerHTML = `${top}<div class="msg">Reihenfolge gesendet! ✅<br><small>Warte auf die anderen…</small></div>`;
      } else {
        const btns = S.q.items.map(it => {
          const orderNum = sortPicks.indexOf(it.idx) + 1;
          return `<button type="button" onclick="pickSort(${it.idx})" style="width:100%;margin:5px 0;padding:14px;font-size:16px;text-align:left;display:flex;justify-content:space-between;align-items:center;background:${orderNum ? '#7c4dff' : '#2d2266'};border:2px solid ${orderNum ? '#ffd33d' : 'transparent'}">
            <span>${esc(it.label)}</span><b>${orderNum ? `#${orderNum}` : 'Antippen'}</b></button>`;
        }).join('');
        app.innerHTML = `${top}<div class="qtxt">${esc(S.q.q)}</div><div style="font-size:13px;opacity:.8;margin-bottom:8px">Tippe der Reihe nach von 1 bis 4 an:</div>${btns}
          <button class="go" ${sortPicks.length < 4 ? 'disabled style="opacity:.45"' : ''} onclick="sendSort()">Reihenfolge absenden (${sortPicks.length}/4)</button>`;
      }
    } else if (S.mode === 'icebreaker') {
      app.innerHTML = myAnswer !== null
        ? `${top}<div class="msg">Antwort gesendet! ✅<br><small>${S.noTvMode ? 'Warte auf die anderen…' : 'Schau gleich auf den TV…'}</small></div>`
        : `${top}<div class="qtxt">${esc(S.q.q)}</div><input id="iceIn" maxlength="120" placeholder="Deine Antwort…" onkeydown="if(event.key==='Enter')sendIce()"><button class="go" onclick="sendIce()">Absenden</button>`;
    } else if (S.mode === 'teams') {
      app.innerHTML = `${top}<div class="qtxt">${esc(S.q.q)}</div><div class="grid">${S.q.a.map((a, i) => `<button class="c${i}" style="font-size:18px" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(${i})">${esc(a)}${myAnswer === i ? ' ✓' : ''}</button>`).join('')}</div>`;
    } else if (S.mode === 'scale') {
      app.innerHTML = myAnswer !== null
        ? `${top}<div class="msg">Deine Bewertung: <b>${myAnswer} / 10</b> ✅</div>`
        : `${top}<div class="qtxt">${esc(S.q.q)}</div>
           <div style="font-size:46px;font-weight:900;color:#ffd33d;margin:12px 0" id="scVal">5</div>
           <input id="scIn" type="range" min="1" max="10" value="5" style="width:100%;accent-color:#ffd33d;padding:0;margin:8px 0" oninput="document.getElementById('scVal').textContent=this.value">
           <div style="display:flex;justify-content:space-between;font-size:14px;opacity:.85;margin-bottom:14px"><span>1: ${esc(S.q.min)}</span><span>10: ${esc(S.q.max)}</span></div>
           <button class="go" onclick="sendScale()">Absenden</button>`;
    } else if (S.mode === 'truthlie') {
      if (S.q && S.q.storyteller === name) {
        app.innerHTML = `${top}<div class="msg">🤫 Die anderen raten jetzt deine Lüge…</div>`;
      } else {
        app.innerHTML = `${top}<div class="qtxt">Was ist die Lüge von ${esc(S.q.storyteller)}?</div><div class="wyr">${S.q.statements.map((st, i) => `<button class="c${i}" style="min-height:12vh;font-size:18px" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(${i})">${esc(st)}${myAnswer === i ? ' ✓' : ''}</button>`).join('')}</div>`;
      }
    } else if (S.mode === 'wordassoc') {
      app.innerHTML = myAnswer !== null
        ? `${top}<div class="msg">⚡ „${esc(myAnswer)}“ ✅</div>`
        : `${top}<div class="qtxt">⚡ ${esc(S.q.w)}</div><input id="waIn" maxlength="30" placeholder="Erstes Wort…" onkeydown="if(event.key==='Enter')sendAssoc()"><button class="go" onclick="sendAssoc()">Absenden</button>`;
    } else if (S.mode === 'songquiz') {
      const cls = S.q.a.length === 2 ? 'wyr' : 'grid';
      const minH = S.q.a.length > 4 ? ';min-height:12vh' : '';
      // Vinyl/EQ nur animieren, wenn wirklich Musik läuft (TV-Modus: am TV; Ohne-TV: auf diesem Handy)
      const musicOn = !S.noTvMode || (playAudioOn && !playAudioBlocked && !playAudioError);
      const vinylHtml = `<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0">
        <div class="vinylDisc${musicOn ? '' : ' paused'}" style="width:64px;height:64px;min-width:64px;min-height:64px"><span style="font-size:22px">🎵</span></div>
        <div class="eqBars${musicOn ? '' : ' paused'}" style="height:36px;min-height:36px">${[0, 1, 2, 3, 4, 5, 6].map(i => `<div class="eqBar" style="width:6px;animation-duration:${0.48 + (i % 4) * 0.12}s;animation-delay:${(i * 0.08).toFixed(2)}s"></div>`).join('')}</div>
      </div>`;
      app.innerHTML = `${top}${renderAudioControls(false)}${vinylHtml}<div class="qtxt">${esc(S.q.q)}</div><div class="${cls}">${S.q.a.map((a, i) => `<button class="c${i}" style="font-size:18px${minH}" ${myAnswer !== null ? 'disabled' : ''} onclick="ans(${i})">${esc(a)}${myAnswer === i ? ' ✓' : ''}</button>`).join('')}</div>${myAnswer !== null ? renderEmojiBar() : ''}`;
    }
    if (S.mode !== 'songquiz' && myAnswer !== null) {
      app.insertAdjacentHTML('beforeend', renderEmojiBar());
    }
    return;
  }

  // Ergebnis-Phase
  const r = S.result || {};
  const mustDrink = (r.drinkers || r.winners || r.yes || []).includes(name);
  let msg = '';
  if (S.mode === 'quiz' || S.mode === 'imagequiz' || S.mode === 'songquiz') {
    msg = myAnswer === null ? '⏰ Zu spät!' : myAnswer === r.correct ? '✅ Richtig!' : '❌ Falsch';
  } else if (S.mode === 'reaction') {
    const e = (r.entries || []).find(x => x.name === name);
    msg = !e || e.ms === null ? '⏰ Zu spät!' : e.ms === -1 ? '❌ Frühstart!' : `⚡ ${e.ms} ms`;
  } else if (S.mode === 'estimate') {
    msg = `Lösung: ${r.answer} ${esc(r.unit || '')}`;
  } else if (S.mode === 'imposter') {
    msg = r.caught ? '✅ Imposter enttarnt!' : '😈 Imposter entkommen!';
  } else if (S.mode === 'draw') {
    msg = `Wort: „${esc(r.word)}“`;
  } else if (S.mode === 'icebreaker') {
    msg = myAnswer ? `💬 „${esc(myAnswer)}“` : '⏰ Keine Antwort!';
  } else if (S.mode === 'teams') {
    msg = myAnswer !== null ? `Team: ${esc((S.q && S.q.a && S.q.a[myAnswer]) || '')}` : '⏰ Zu spät!';
  } else if (S.mode === 'scale') {
    msg = myAnswer !== null ? `📊 Dein Wert: ${myAnswer}/10` : '⏰ Keine Angabe!';
  } else if (S.mode === 'truthlie') {
    msg = S.q && S.q.storyteller === name
      ? (mustDrink ? '😅 Alle haben es erraten!' : '🎭 Gut geschummelt!')
      : (myAnswer === r.lieIdx ? '✅ Lüge entlarvt!' : '❌ Reingefallen!');
  } else if (S.mode === 'wordassoc') {
    msg = myAnswer ? `⚡ „${esc(myAnswer)}“` : '⏰ Zu langsam!';
  } else if (S.mode === 'neverhavei') {
    msg = myAnswer === true ? '🙌 Hab ich schon' : myAnswer === false ? '😇 Noch nie' : '⏰ Keine Antwort!';
  } else {
    msg = myAnswer !== null ? '✅ Antwort gezählt!' : '⏰ Zu spät!';
  }
  const isGood = msg.startsWith('✅') || msg.startsWith('⚡') || msg.startsWith('🎭');
  const isBad = msg.startsWith('❌') || msg.startsWith('⏰') || msg.startsWith('😈');
  const details = renderPhoneResult();
  const gainTag = me && me.lastGain > 0 ? ` <span class="gainBadge" style="font-size:14px">+${me.lastGain}</span>` : '';
  const resVib = `res:${S.mode}:${S.idx}`;
  if (lastVibKey !== resVib) {
    lastVibKey = resVib;
    if (me && me.lastGain > 0) { pgVibrate([20, 50, 20]); if (isGood) pgConfetti(40); }
    else if (isBad) pgVibrate(90);
  }
  const nextBannerHtml = S.mode === 'songquiz' ? '<div style="text-align:center"><div class="nextBanner" style="font-size:15px;padding:10px 16px;margin:10px auto">⏭️ Es geht weiter…</div></div>' : '';
  app.innerHTML = `${top}<div class="msg ${isGood ? 'good' : isBad ? 'bad' : ''}" style="margin-top:2vh">${msg}<br><small>${me ? me.score : 0} Pkt${gainTag}</small></div>${nextBannerHtml}${renderEmojiBar()}${details}`;
}

function renderLb(title = '🏆 Rangliste') {
  if (!S) return '';
  const isRes = S.phase === 'result';
  if (S.teamMode && S.teams && S.teams.length) {
    const rows = S.teams.map((t, i) => {
      const gainHtml = isRes && t.lastGain > 0 ? `<span class="gainBadge" style="font-size:11px;padding:1px 6px;margin-right:5px">+${t.lastGain}</span>` : '';
      const from = isRes && typeof t.prevScore === 'number' ? t.prevScore : t.score;
      return `<div class="resRow"><span>${['🥇', '🥈', '🥉'][i] || `${i + 1}.`} ${esc(t.label)}</span><span>${gainHtml}<b class="scoreNum" data-from="${from}" data-to="${t.score}">${from} Pkt</b></span></div>`;
    }).join('');
    return `<div class="resBox"><div class="resTitle">${title}</div>${rows}</div>`;
  }
  const rows = S.players.map((p, i) => {
    const gainHtml = isRes && p.lastGain > 0 ? `<span class="gainBadge" style="font-size:11px;padding:1px 6px;margin-right:5px">+${p.lastGain}</span>` : '';
    const from = isRes && typeof p.prevScore === 'number' ? p.prevScore : p.score;
    return `<div class="resRow" style="${p.name === name ? 'border:1px solid #ffd33d' : ''}"><span>${['🥇', '🥈', '🥉'][i] || `${i + 1}.`} ${esc(p.avatar)} ${esc(p.name)}${pStreakTag(p)}</span><span>${gainHtml}<b class="scoreNum" data-from="${from}" data-to="${p.score}">${from} Pkt</b></span></div>`;
  }).join('');
  return `<div class="resBox"><div class="resTitle">${title}</div>${rows}</div>`;
}

function renderPhoneResult() {
  const r = S.result || {};
  const m = S.mode;
  let body = '';
  if (m === 'quiz' || m === 'imagequiz' || m === 'songquiz') {
    const artDisc = m === 'songquiz'
      ? `<div class="vinylDisc" style="width:58px;height:58px;min-width:58px;min-height:58px">${r.art && /^(https:\/\/|\/song-art\/)/i.test(r.art) ? `<img src="${esc(r.art)}" alt="Cover" decoding="async" loading="eager">` : '<span style="font-size:20px">🎵</span>'}</div>`
      : '';
    const song = m === 'songquiz' && r.title ? `<div class="resRow" style="justify-content:center;text-align:left;gap:12px">${artDisc}<div><b>🎵 ${esc(r.title)}</b><br><small style="opacity:.8">${esc(r.artist)} · ${r.year}</small></div></div>` : '';
    const ansHtml = S.q && S.q.a ? S.q.a.map((a, i) => `<div class="resAns c${i} ${i === r.correct ? 'win' : 'dim'}"><span>${i === r.correct ? '✔ ' : ''}${esc(a)}</span><span>${(r.counts && r.counts[i]) || 0}</span></div>`).join('') : '';
    body = `<div class="resBox"><div class="resTitle">Auflösung</div>${song}${ansHtml}</div>${renderLb()}`;
  } else if (m === 'mostlikely') {
    const win = r.winners && r.winners.length ? `<div class="resTitle">🏆 ${r.winners.map(esc).join(' & ')} (${r.max} ${r.max === 1 ? 'Stimme' : 'Stimmen'})</div>` : '<div class="resTitle">Ergebnis</div>';
    const rows = (r.votes || []).filter(v => v.count > 0).map(v => `<div class="resRow"><span>${esc(v.name)}</span><b>${v.count}</b></div>`).join('');
    body = `<div class="resBox">${win}${rows || '<div class="resRow">Keine Stimmen</div>'}</div>`;
  } else if (m === 'wouldyourather' && S.q) {
    const aL = (r.aNames || []).length, bL = (r.bNames || []).length, tot = aL + bL;
    const pctA = tot ? Math.round((aL / tot) * 100) : 50, pctB = 100 - pctA;
    body = `<div class="resBox"><div class="resTitle">Tauziehen</div>
      <div class="tugTrack" style="height:28px;min-height:28px;margin-bottom:10px">
        <div class="tugSideA" style="width:${pctA}%;font-size:13px">${pctA >= 15 ? `${pctA}%` : ''}</div>
        <div class="tugSideB" style="width:${pctB}%;font-size:13px">${pctB >= 15 ? `${pctB}%` : ''}</div>
      </div>
      <div class="resAns c0 ${r.loser === 'A' ? 'dim' : ''}"><span>${esc(S.q.a)}</span><span>${aL}</span></div>
      <div class="resAns c1 ${r.loser === 'B' ? 'dim' : ''}"><span>${esc(S.q.b)}</span><span>${bL}</span></div>
    </div>`;
  } else if (m === 'estimate') {
    const rows = (r.entries || []).map((e, i) => `<div class="resRow"><span>${i === 0 && e.val !== null ? '🥇 ' : ''}${esc(e.name)}</span><b>${e.val !== null ? `${e.val} ${esc(r.unit || '')}` : '—'}</b></div>`).join('');
    body = `<div class="resBox"><div class="resTitle">${r.best ? `🥇 Am nächsten: ${esc(r.best)}` : 'Schätzungen'}</div>${rows}</div>${renderLb()}`;
  } else if (m === 'neverhavei') {
    const yes = (r.yes || []).map(n => `<span class="resChip">${esc(n)}</span>`).join('') || '<span class="resChip">—</span>';
    const no = (r.no || []).map(n => `<span class="resChip">${esc(n)}</span>`).join('') || '<span class="resChip">—</span>';
    body = `<div class="resBox"><div class="resTitle">🙌 Hab ich schon</div><div class="resChips">${yes}</div><div class="resTitle" style="margin-top:12px">😇 Noch nie</div><div class="resChips">${no}</div></div>`;
  } else if (m === 'imposter') {
    const imp = (r.imposters || []).map(esc).join(', ');
    const acc = r.accused && r.accused.length ? r.accused.map(esc).join(' & ') : 'Niemand';
    const w = r.words ? `„${esc(r.words[1])}“ vs. „${esc(r.words[0])}“` : '';
    body = `<div class="flipScene" style="height:125px;min-height:125px;margin:12px auto"><div class="flipCard">
      <div class="flipFace flipFront" style="padding:12px"><div style="font-size:13px;opacity:.85">🗳️ Verdächtigt:</div><div style="font-size:22px;font-weight:900;color:#ffd33d;margin-top:4px">🔎 ${acc}</div></div>
      <div class="flipFace flipBack ${r.caught ? 'good' : 'bad'}" style="padding:12px"><div style="font-size:19px;font-weight:900">${r.caught ? '✅ IMPOSTER ENTTARNT!' : '😈 IMPOSTER ENTKOMMEN!'}</div><div style="font-size:13px;margin-top:4px">🕵️ ${imp} · ${w}</div></div>
    </div></div>${renderLb()}`;
  } else if (m === 'draw' || m === 'taboo') {
    const gb = (r.guessedBy || []).map(esc).join(', ') || 'niemandem';
    body = `<div class="resBox"><div class="resTitle">Wort: „${esc(r.word || '')}“ · Erraten von: ${gb}</div></div>${renderLb()}`;
  } else if (m === 'sort') {
    const orderRows = (r.items || []).map((it, i) => `<div class="resRow"><span><b>${i + 1}.</b> ${esc(it.label)}</span><b>${esc(it.display)}</b></div>`).join('');
    body = `<div class="resBox"><div class="resTitle">Richtige Reihenfolge</div>${orderRows}</div>${renderLb()}`;
  } else if (m === 'icebreaker') {
    const rows = (r.entries || []).map(e => `<div class="resRow"><span>💬 ${esc(e.text)}</span></div>`).join('');
    body = `<div class="resBox"><div class="resTitle">Antworten</div>${rows || '<div class="resRow">Keine Antworten</div>'}</div>`;
  } else if (m === 'teams' && S.q) {
    const rows = S.q.a.map((a, i) => {
      const names = (r.groups && r.groups[i]) || [];
      return `<div class="resAns c${i} ${names.length === 0 ? 'dim' : ''}"><span>${esc(a)}</span><span>${names.map(esc).join(', ') || '—'}</span></div>`;
    }).join('');
    body = `<div class="resBox"><div class="resTitle">Gruppen</div>${rows}</div>`;
  } else if (m === 'scale') {
    const rows = (r.entries || []).map(e => `<div class="resRow"><span>${esc(e.name)}</span><b>${e.val !== null ? `${e.val}/10` : '—'}</b></div>`).join('');
    body = `<div class="resBox"><div class="resTitle">${r.avg !== null && r.avg !== undefined ? `Durchschnitt: ${r.avg} / 10` : 'Bewertungen'}</div>${rows}</div>`;
  } else if (m === 'truthlie' && S.q) {
    const rows = S.q.statements.map((st, i) => `<div class="resAns ${i === r.lieIdx ? 'c0 win' : 'c1 dim'}"><span>${i === r.lieIdx ? '🚨 LÜGE: ' : ''}${esc(st)}</span><span>${(r.counts && r.counts[i]) || 0}</span></div>`).join('');
    const info = r.caughtBy && r.caughtBy.length ? `Entlarvt von: ${r.caughtBy.map(esc).join(', ')}` : `Niemand hat's gemerkt! (+1000 Pkt für ${esc(r.storyteller || '')})`;
    body = `<div class="resBox"><div class="resTitle">${info}</div>${rows}</div>${renderLb()}`;
  } else if (m === 'wordassoc') {
    const rows = (r.entries || []).map(e => `<div class="resRow"><span>${esc(e.avatar || '')} ${esc(e.name)}</span><b>${e.word ? esc(e.word) : '—'}</b></div>`).join('');
    body = `<div class="resBox"><div class="resTitle">⚡ ${esc((S.q && S.q.w) || '')}</div>${rows}</div>`;
  } else if (m === 'reaction') {
    const rows = (r.entries || []).map((e, i) => `<div class="resRow"><span>${i + 1}. ${esc(e.name)}</span><b>${e.ms === -1 ? '❌ Zu früh!' : e.ms === null ? '⏰ Keine Antwort' : `${e.ms} ms`}</b></div>`).join('');
    body = `<div class="resBox"><div class="resTitle">${r.fastest ? `⚡ Schnellster: ${esc(r.fastest)}` : 'Ergebnis'}</div>${rows}</div>${renderLb()}`;
  }
  return body;
}

function updatePhoneTimerUI() {
  const b = document.getElementById('pbar'), s = document.getElementById('psec');
  if (!S || S.phase === 'lobby' || S.phase === 'end' || S.phase === 'spin') return;
  if (!clientDeadline) {
    pgSetBar(b, 1);
    if (s) {
      pgSetText(s, S.paused ? '⏸ PAUSE' : S.phase === 'discuss' ? 'Diskussion' : S.phase === 'write' ? 'Ausdenken…' : S.phase === 'result' ? '⏸ Warte auf Weiter…' : '');
      s.classList.remove('urgent');
    }
    return;
  }
  const left = Math.max(0, clientDeadline - performance.now());
  const dur = Math.max(1000, clientTotalMs);
  pgSetBar(b, left / dur);
  const sLeft = Math.ceil(left / 1000);
  // Letzte 3 Sekunden: kurzer Haptik-Tick, solange noch nicht geantwortet (Android; iOS ignoriert vibrate)
  if (S.phase === 'question' && myAnswer === null && joined && sLeft >= 1 && sLeft <= 3 && sLeft !== phoneTickSec) {
    phoneTickSec = sLeft;
    pgVibrate(15);
  }
  if (s) {
    pgSetText(s, S.phase === 'result' ? `Weiter in ${sLeft}s…` : `⏱ ${sLeft}s`);
    s.classList.toggle('urgent', (S.phase === 'question' || S.phase === 'go') && sLeft >= 1 && sLeft <= 3);
  }
}

render();
setInterval(updatePhoneTimerUI, 100);
</script></body></html>
