<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>PartyGame · Fotos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  body { padding: 16px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .card { background: #2d2266; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { background: #4b3a9e; color: #fff; padding: 12px 16px; border-radius: 12px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn.dl { background: #26890c; }
  .btn.del { background: #b3261e; }
  input[type=text] { padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: #1b1340; color: #fff; font-size: 15px; min-width: 160px; flex: 1; }
  .info { font-size: 13px; opacity: .8; margin-top: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .grid button { padding: 0; background: #0006; border-radius: 10px; overflow: hidden; aspect-ratio: 1; position: relative; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid small { position: absolute; left: 6px; bottom: 6px; background: #000a; border-radius: 6px; padding: 2px 6px; font-size: 11px; }
  .empty { text-align: center; opacity: .75; padding: 30px 10px; }
  #lightbox { position: fixed; inset: 0; z-index: 9000; background: rgba(10, 6, 30, .95); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  #lightbox.on { display: flex; }
  #lightbox img { max-width: 100%; max-height: 78vh; border-radius: 12px; }
</style></head>
<body>
<h1>📸 Party-Fotos · Raum <span id="code"></span></h1>
<div class="card">
  <div class="row">
    <input id="name" type="text" maxlength="16" placeholder="Dein Name (optional)">
    <label class="photoBtn">📷 Foto aufnehmen<input type="file" accept="image/*" capture="environment" onchange="upload(this)"></label>
    <label class="photoBtn" style="background:#4b3a9e">🖼️ Aus Galerie<input type="file" accept="image/*" multiple onchange="upload(this)"></label>
  </div>
  <div class="row" style="margin-top:10px">
    <a id="zip" class="btn dl" href="#">⬇️ Alle als ZIP</a>
    <button class="btn" type="button" onclick="copyLink()">📋 Galerie-Link kopieren</button>
  </div>
  <div class="info">Alle mit dem Raum-Link können die Fotos sehen und weitere hochladen. Jedes Foto wird 7 Tage nach dem Hochladen automatisch gelöscht. Eigene Fotos (als Spielleitung alle) kannst du in der Großansicht mit 🗑️ löschen.</div>
</div>
<div id="grid" class="grid"></div>
<div id="lightbox" onclick="if(event.target===this)closeBox()">
  <img id="lbImg" alt="">
  <div class="row"><a id="lbDl" class="btn dl" href="#">⬇️ Herunterladen</a><button id="lbDel" class="btn del" type="button" onclick="deleteCurrent()">🗑️ Löschen</button><button class="btn" type="button" onclick="closeBox()">✕ Schließen</button></div>
</div>
<script src="/js/ux-helpers.js"></script>
<script>
// esc() is provided by /js/ux-helpers.js
const ROOM_CODE = (new URLSearchParams(location.search).get('room') || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
const nameInp = document.getElementById('name');
// Eigener Schlüssel: „qn“ gehört dem Spiel (Auto-Rejoin) und darf hier nicht überschrieben werden
nameInp.value = localStorage.getItem('pg_photo_name') || localStorage.getItem('qn') || '';
nameInp.oninput = () => localStorage.setItem('pg_photo_name', nameInp.value.trim());
document.getElementById('code').textContent = ROOM_CODE || '–';
document.getElementById('zip').href = '/api/photos/' + encodeURIComponent(ROOM_CODE) + '/zip';
let photos = [];
let lastSig = null;
let boxIdx = -1;
const isHost = () => !!localStorage.getItem('pg_host_' + ROOM_CODE);
const canDelete = p => !!p && (isHost() || !!pgPhotoKey(p.id));

async function load() {
  const grid = document.getElementById('grid');
  if (!ROOM_CODE) { grid.innerHTML = '<div class="empty">Kein Raumcode im Link.</div>'; return; }
  try {
    const r = await fetch('/api/photos/' + encodeURIComponent(ROOM_CODE));
    const d = await r.json();
    if (!r.ok) { grid.innerHTML = `<div class="empty">${esc(d.error || 'Fotos nicht gefunden')}</div>`; return; }
    photos = d.photos.slice().reverse(); // neueste zuerst
  } catch { return; }
  const sig = photos.map(p => p.id).join(',');
  if (sig === lastSig) return;
  lastSig = sig;
  document.getElementById('zip').style.display = photos.length ? '' : 'none';
  grid.innerHTML = photos.length
    ? photos.map((p, i) => `<button type="button" onclick="openBox(${i})"><img src="${esc(p.url)}" loading="lazy" alt="">${p.name || pgPhotoKey(p.id) ? `<small>📸 ${esc(p.name || '')}${pgPhotoKey(p.id) ? ' · deins' : ''}</small>` : ''}</button>`).join('')
    : '<div class="empty" style="grid-column:1/-1">Noch keine Fotos – lade das erste hoch! 🎉</div>';
}
function openBox(i) {
  const p = photos[i];
  if (!p) return;
  boxIdx = i;
  document.getElementById('lbImg').src = p.url;
  document.getElementById('lbDl').href = p.url + '?dl=1';
  document.getElementById('lbDel').style.display = canDelete(p) ? '' : 'none';
  document.getElementById('lightbox').classList.add('on');
}
function closeBox() { document.getElementById('lightbox').classList.remove('on'); boxIdx = -1; }
async function deleteCurrent() {
  const p = photos[boxIdx];
  if (!p || !confirm('Dieses Foto wirklich löschen? Das geht nicht rückgängig.')) return;
  const r = await pgDeletePhoto(ROOM_CODE, p.id);
  if (!r.ok) { pgToast('⚠️ ' + r.error, 3500); return; }
  pgToast('🗑️ Foto gelöscht');
  closeBox();
  lastSig = null;
  load();
}
function upload(input) { pgPhotoInput(input, ROOM_CODE, nameInp.value.trim(), load); }
async function copyLink() {
  if (await pgCopyText(location.origin + '/fotos?room=' + encodeURIComponent(ROOM_CODE))) pgToast('✅ Link kopiert');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBox(); });
load();
setInterval(load, 15000);
</script>
</body></html>
