<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1340">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>PartyGame Host</title>
<link rel="stylesheet" href="/style.css">
<style>
 body { padding: clamp(12px, 2.5vh, 28px) clamp(14px, 3.5vw, 48px) clamp(10px, 2vh, 22px); font-size: clamp(14px, 2.1vmin, 24px); display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; }
 #app { flex: 1; min-width: 0; display: flex; flex-direction: column; }
 #app > * { flex-shrink: 0; }
 #app.drawing { flex: 0 0 auto; }
 /* Spielansichten: Inhalt unter dem Kopf vertikal ausbalancieren (wachsende Elemente fressen den Freiraum zuerst) */
 #app.game > .hdrEnd + * { margin-top: auto; }
 #app.game > :last-child { margin-bottom: auto; }
 .hdrInfo { font-size: clamp(14px, 2.2vmin, 28px); }
 h1 { font-size: clamp(24px, 5.2vmin, 68px); margin: 0 0 1.6vh; line-height: 1.15; }
 .row { display: flex; gap: clamp(16px, 3.5vw, 48px); align-items: flex-start; }
 .big { font-size: clamp(18px, 4.2vmin, 52px); font-weight: 700; line-height: 1.25; }
 .url { font-size: clamp(13px, 2.4vmin, 30px); opacity: .8; margin-top: 1vh; overflow-wrap: anywhere; text-align: center; }
 .chips { display: flex; flex-wrap: wrap; gap: .6vh .6vw; }
 .chips span { display: inline-block; background: #4b3a9e; border-radius: 30px; padding: clamp(5px, .8vh, 12px) clamp(12px, 1.6vw, 24px); font-size: clamp(14px, 2.5vmin, 30px); animation: popIn .25s ease-out both; }
 .chips span.seen { animation: none; }
 /* Lobby */
 .lobbyWrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
 .lobbyWrap h1 { margin-bottom: 1.2vh; }
 .row.lobby { flex: 1; align-items: stretch; gap: clamp(16px, 3.5vw, 64px); }
 .lobbyJoin { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2vh, 28px); background: rgba(45, 34, 102, .55); border: 2px solid #ffffff1a; border-radius: 24px; padding: clamp(12px, 2.5vh, 32px) clamp(12px, 2vw, 36px); }
 .lobbyJoin .qr-copy { display: flex; flex-direction: column; align-items: center; }
 .lobby img { width: min(38vh, 30vw, 480px); height: auto; max-width: 100%; background: #fff; padding: clamp(6px, 1vmin, 14px); border-radius: 14px; display: block; }
 .joinBox { text-align: center; }
 .joinLbl { font-size: clamp(12px, 1.9vmin, 22px); text-transform: uppercase; letter-spacing: .22em; opacity: .7; font-weight: 800; }
 .joinCode { font-size: clamp(40px, 10vmin, 140px); font-weight: 900; letter-spacing: .14em; padding-left: .14em; color: #ffd33d; line-height: 1.05; text-shadow: 0 6px 24px rgba(0,0,0,.45); }
 .joinHint { font-size: clamp(14px, 2.4vmin, 30px); line-height: 1.3; max-width: min(42vh, 32vw, 520px); margin: .6vh auto 0; }
 .joinHint b { color: #ffd33d; overflow-wrap: anywhere; }
 .lobbyMain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: clamp(10px, 2vh, 28px); }
 .lobbyRules { background: #2d2266; border-left: 6px solid #ffd33d; border-radius: 14px; padding: clamp(10px, 1.8vh, 24px) clamp(12px, 1.8vw, 28px); font-size: clamp(15px, 2.6vmin, 32px); line-height: 1.35; animation: fadeSlideUp .3s ease-out both; }
 .lobbyRules b { color: #ffd33d; }
 .lobbyCountRow { display: flex; align-items: baseline; flex-wrap: wrap; gap: .4vh 2vw; }
 .lobbyCount { font-size: clamp(18px, 3.8vmin, 48px); font-weight: 900; }
 .lobbyRounds { font-size: clamp(14px, 2.3vmin, 28px); opacity: .75; font-weight: 700; }
 .lobbyPlayers { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(96px, 10vw, 180px), 1fr)); gap: clamp(8px, 1.4vmin, 18px); align-content: start; }
 .pCard { position: relative; min-width: 0; background: #4b3a9e; border: 2px solid #ffffff1f; border-radius: 18px; padding: clamp(8px, 1.4vh, 18px) clamp(6px, .6vw, 12px) clamp(6px, 1.1vh, 14px); text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); animation: popIn .35s ease-out both; }
 .pCard.seen { animation: none; }
 .pCard .pAv { font-size: clamp(34px, 7.5vmin, 100px); line-height: 1.1; }
 .pCard .pName { font-size: clamp(13px, 2.3vmin, 28px); font-weight: 800; margin-top: .6vh; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 .pCard .pTeam { position: absolute; top: .5vh; right: .4vw; font-size: clamp(14px, 2.4vmin, 28px); }
 .lobbyPlayers.many { grid-template-columns: repeat(auto-fill, minmax(clamp(80px, 7.5vw, 132px), 1fr)); }
 .lobbyPlayers.many .pAv { font-size: clamp(26px, 5vmin, 64px); }
 .lobbyPlayers.many .pName { font-size: clamp(12px, 1.8vmin, 22px); }
 .pWait { grid-column: 1 / -1; text-align: center; opacity: .6; font-size: clamp(16px, 3vmin, 36px); padding: 3vh 2vw; border: 2px dashed #ffffff33; border-radius: 18px; }
 /* Fragen & Antwort-Kacheln */
 .q { font-size: clamp(22px, 6vmin, 80px); font-weight: 700; margin: 1.5vh 0 2.4vh; line-height: 1.18; text-wrap: balance; animation: fadeSlideUp .3s ease-out both; }
 .q.sm { font-size: clamp(20px, 4.8vmin, 62px); }
 .iqWrap { display: flex; justify-content: center; margin: .8vh 0 2vh; animation: popIn .3s ease-out both; }
 .iqImg { max-height: 34vh; max-width: 72vw; border-radius: 16px; object-fit: contain; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
 .iqImg.iqLogo { background: #fff; padding: clamp(14px, 2.6vh, 28px); width: min(28vh, 45vw); height: min(28vh, 45vw); }
 .answers { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: clamp(10px, 1.8vmin, 24px); }
 #app.game:not(.res) > .answers { flex: 1 1 auto; max-height: 58vh; }
 .ans { padding: clamp(14px, 3.6vh, 48px) clamp(14px, 2vw, 30px); border-radius: 14px; font-size: clamp(16px, 3.6vmin, 44px); font-weight: 700; position: relative; animation: fadeSlideUp .28s ease-out both; transition: opacity .35s ease, transform .25s ease; }
 /* Eigene Endzustand-Animation, damit die Füllung von fadeSlideUp die Abdunklung nicht überschreibt */
 @keyframes ansDimIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: .25; transform: scale(.97); } }
 .ans.dim { opacity: .25; transform: scale(.97); animation: ansDimIn .3s ease-out both; } .ans .n { float: right; margin-left: 12px; }
 .ans.tile { display: flex; align-items: center; gap: clamp(10px, 1.2vw, 22px); min-height: clamp(64px, 14vh, 200px); font-size: clamp(18px, 4.6vmin, 60px); line-height: 1.15; padding: clamp(10px, 2vh, 30px) clamp(14px, 1.8vw, 32px); box-shadow: 0 8px 22px rgba(0,0,0,.28); }
 .ans.tile .txt { flex: 1; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
 .ans.tile .n { float: none; margin-left: auto; flex-shrink: 0; background: rgba(0,0,0,.25); border-radius: 99px; padding: .1em .55em; font-size: .8em; font-variant-numeric: tabular-nums; }
 .ans .shape { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 1.5em; height: 1.5em; border-radius: 50%; background: rgba(0,0,0,.22); font-size: .85em; line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
 .answers.compact .ans.tile { min-height: clamp(52px, 9vh, 130px); font-size: clamp(16px, 3.8vmin, 48px); }
 #app.game:not(.res) > .answers.compact { max-height: 40vh; }
 .answers.tl { grid-template-columns: 1fr; }
 .answers.tl .ans.tile { min-height: clamp(52px, 10vh, 150px); font-size: clamp(16px, 3.8vmin, 48px); }
 /* 5–6 Antworten (z. B. Song-Quiz „Von wem?“): Frage 3 Spalten; im Ergebnis 2 Spalten mit flachen Kacheln,
    damit neben Song-Banner + Rangliste alles ins Bild passt (Tablet). Zeilen nicht auf die höchste Kachel strecken. */
 .answers.many { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: auto; }
 .answers.many .ans.tile { min-height: clamp(48px, 9vh, 120px); font-size: clamp(15px, 3.2vmin, 42px); }
 #app.game.res .answers.many { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(8px, 1.2vmin, 16px); }
 #app.game.res .answers.many .ans.tile { min-height: clamp(40px, 6vh, 90px); font-size: clamp(14px, 2.7vmin, 36px); padding-top: clamp(6px, 1vh, 14px); padding-bottom: clamp(6px, 1vh, 14px); }
 .ansCell { display: flex; flex-direction: column; gap: clamp(4px, .8vh, 10px); min-width: 0; }
 .ansCell > .ans { flex: 1; }
 /* Wer hat was gewählt: kleine Avatar-Badges */
 .pickers { display: flex; flex-wrap: wrap; gap: clamp(4px, .6vh, 8px) clamp(4px, .5vw, 8px); }
 .pk { display: inline-flex; align-items: center; gap: .35em; max-width: 100%; background: rgba(45, 34, 102, .92); border: 1.5px solid #ffffff2e; border-radius: 99px; padding: .2em .75em .2em .3em; font-size: clamp(12px, 2vmin, 24px); font-weight: 700; animation: popIn .3s ease-out both; }
 .pk i { font-style: normal; font-size: 1.3em; line-height: 1; }
 .pk b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 .winner + .pickers .pk { border-color: #ffd33d; }
 .resSplit { display: flex; flex-direction: column; gap: clamp(10px, 2vh, 28px); }
 .resSplit h2 { margin: 0 0 .6vh; font-size: clamp(18px, 3.2vmin, 38px); }
 .voteChips { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 1.4vmin, 18px); }
 .voteChips span { display: inline-flex; align-items: center; gap: .4em; background: #4b3a9e; border: 2px solid #ffffff1f; border-radius: 99px; padding: .35em 1em .35em .45em; font-size: clamp(18px, 3.4vmin, 44px); font-weight: 700; animation: popIn .3s ease-out both; }
 .voteChips i { font-style: normal; font-size: 1.35em; line-height: 1; }
 .mlVotes > div { align-items: center; }
 .mlVotes .mlWho { display: inline-flex; align-items: center; gap: .4em; flex-shrink: 0; }
 .mlVotes .mlWho i { font-style: normal; font-size: 1.4em; line-height: 1; }
 .mlVotes .pickers { flex: 1; justify-content: flex-end; }
 .mlVotes .pk { font-size: clamp(11px, 1.8vmin, 20px); }
 .mlVotes > div > b { flex-shrink: 0; }
 .emptyRes { text-align: center; background: #2d2266; border: 2px dashed #ffffff33; border-radius: 22px; padding: clamp(18px, 5vh, 60px) 3vw; margin: 2vh 0; font-size: clamp(22px, 5vmin, 64px); font-weight: 800; animation: popIn .35s ease-out both; }
 .emptyRes small { display: block; font-size: .45em; font-weight: 600; opacity: .75; margin-top: 1vh; }
 .bar { height: clamp(8px, 1.4vh, 16px); background: #fff3; border-radius: 10px; margin-bottom: 1.8vh; overflow: hidden; }
 .bar div { height: 100%; background: #ffd33d; transform-origin: left center; transition: transform .1s linear; will-change: transform; }
 .lb div { display: flex; justify-content: space-between; gap: 12px; background: #2d2266; border-radius: 12px; padding: clamp(8px, 1.2vh, 16px) clamp(12px, 1.8vw, 24px); margin: .7vh 0; font-size: clamp(15px, 2.8vmin, 34px); animation: fadeSlideUp .28s ease-out both; }
 .drink { background: #e21b3c; border-radius: 18px; padding: clamp(14px, 2.5vh, 32px) clamp(16px, 3vw, 40px); font-size: clamp(20px, 4.5vmin, 56px); font-weight: 800; margin: 1.8vh 0 2vh; text-align: center; animation: popIn .35s ease-out both; }
 .drink.good { background: #26890c; }
 .drink small { display: block; font-size: clamp(14px, 2.4vmin, 30px); font-weight: 500; opacity: .9; margin-top: .8vh; }
 .react { border-radius: 22px; padding: clamp(36px, 11vh, 140px) 4vw; text-align: center; font-size: clamp(26px, 6.5vmin, 80px); font-weight: 900; margin-top: 3vh; animation: popIn .2s ease-out both; }
 .react.wait { background: #e21b3c; }
 .react.go { background: #26890c; animation: pulseGo .9s infinite ease-in-out; }
 .cols { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(12px, 2.5vw, 32px); }
 .card { background: #2d2266; border-radius: 16px; padding: clamp(12px, 2.2vh, 28px) clamp(14px, 2.2vw, 32px); animation: fadeSlideUp .3s ease-out both; }
 .card h2 { margin-top: 0; font-size: clamp(18px, 3.2vmin, 38px); }
 .pcard { max-width: 1100px; margin: 2vh auto 0; background: linear-gradient(160deg, #4b3a9e, #2d2266); border: 3px solid #ffd33d; border-radius: 28px; padding: clamp(18px, 4vh, 56px) clamp(18px, 4vw, 64px); text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,.45); animation: popIn .45s cubic-bezier(.2,1.4,.4,1) both; }
 .pcKicker { font-size: clamp(14px, 2.2vmin, 26px); letter-spacing: .25em; text-transform: uppercase; opacity: .7; font-weight: 800; }
 .pcTitle { font-size: clamp(26px, 6vmin, 76px); font-weight: 900; color: #ffd33d; margin: .6vh 0 1.4vh; text-shadow: 0 4px 18px rgba(0,0,0,.4); }
 .pcTarget { display: inline-block; background: #ffd33d; color: #1b1340; font-weight: 900; font-size: clamp(18px, 3.6vmin, 44px); padding: .6vh 2vw; border-radius: 999px; margin-bottom: 1.6vh; }
 .pcText { font-size: clamp(22px, 4.6vmin, 58px); font-weight: 800; line-height: 1.25; }
 .pcInfo { font-size: clamp(15px, 2.6vmin, 32px); margin-top: 2vh; opacity: .85; font-weight: 600; }
 .pcOutcome { margin-top: 2.4vh; font-size: clamp(22px, 4.8vmin, 60px); font-weight: 900; background: #26890c; border-radius: 18px; padding: 1.4vh 2vw; animation: popIn .35s ease-out both; }
 .pcOutcome.bad { background: #e21b3c; }
 .pcLb { max-width: 900px; margin: 2vh auto 0; }
 .ruleTag { display: inline-block; margin-top: .6vh; background: rgba(255,211,61,.16); border: 1px solid #ffd33d; color: #ffd33d; border-radius: 10px; padding: .3vh 1vw; font-size: clamp(13px, 2vmin, 24px); font-weight: 700; }
 .endPhotos { display: flex; gap: clamp(12px, 3vw, 40px); align-items: center; justify-content: center; margin: 1.5vh 0 2vh; }
 #endSlide { height: clamp(140px, 30vh, 420px); max-width: 55vw; object-fit: contain; border-radius: 14px; border: 5px solid #fff; background: #000; transition: opacity .4s ease; }
 .endSlideBox { display: flex; flex-direction: column; align-items: center; }
 .endSlideCap { margin-top: .8vh; max-width: 55vw; min-height: 1.3em; text-align: center; font-weight: 800; font-size: clamp(14px, 2.4vmin, 28px); color: #ffd33d; }
 .awardGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(22vw, 300px), 1fr)); gap: 1.2vmin; margin-bottom: 2vh; }
 .awardGrid .card { text-align: center; margin: 0; padding: 1.2vh 1vw; }
 .endNoPhoto { font-size: clamp(60px, 14vmin, 160px); opacity: .5; }
 .endQr { width: clamp(110px, 18vmin, 220px); height: clamp(110px, 18vmin, 220px); background: #fff; padding: 6px; border-radius: 10px; margin: 1vh 0; }
 .photoPop.mini { inset: auto 2vw 2vh auto; background: transparent; }
 .photoPop.mini img { max-width: 22vw; max-height: 28vh; border-width: 4px; }
 .photoPop.mini div { font-size: clamp(13px, 2vmin, 22px); margin-top: .6vh; }
 #drawWrap { display: none; gap: clamp(12px, 2.5vw, 36px); margin-top: 1.8vh; align-items: flex-start; }
 #tvCanvas { background: #fff; border-radius: 16px; width: 62vw; max-width: 100%; height: auto; aspect-ratio: 1000 / 620; max-height: 62vh; display: block; }
 .drawSide { flex: 1; min-width: 0; width: 100%; }
 .guesses div { background: #2d2266; padding: clamp(6px, 1vh, 14px) clamp(10px, 1.5vw, 20px); border-radius: 10px; margin: .7vh 0; font-size: clamp(14px, 2.4vmin, 28px); }
 .footer { display: flex; align-items: flex-end; justify-content: flex-start; flex-wrap: wrap; gap: clamp(8px, 1.8vw, 20px); margin-top: 2vh; }
 .hint { opacity: .5; font-size: clamp(12px, 1.8vmin, 20px); margin-left: auto; text-align: right; }
 .qr-corner { display: none; flex-direction: column; align-items: center; background: rgba(45, 34, 102, .7); padding: clamp(5px, .8vmin, 10px); border-radius: 12px; pointer-events: none; }
 .qr-corner img { width: clamp(64px, 10vmin, 110px); height: clamp(64px, 10vmin, 110px); background: #fff; padding: clamp(3px, .5vmin, 6px); border-radius: 8px; display: block; }
 .qr-corner .url { font-size: clamp(11px, 1.3vmin, 16px); margin-top: .4vh; opacity: .85; }
 .qr-copy { cursor: pointer; position: relative; transition: transform .15s ease; user-select: none; }
 .qr-copy:hover { transform: scale(1.02); }
 .qr-copy:active { transform: scale(.98); }
 .qr-copied-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(38, 137, 12, .95); color: #fff; font-weight: 800; font-size: clamp(14px, 2.2vmin, 24px); padding: 8px 16px; border-radius: 12px; border: 2px solid #ffd33d; pointer-events: none; opacity: 0; transition: opacity .18s ease; white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
 .qr-copied-badge.show { opacity: 1; }
 .lobby-play-btn { display: none; margin-left: auto; background: rgba(45, 34, 102, .75); color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.18); padding: clamp(5px, .7vh, 10px) clamp(10px, 1.2vw, 16px); border-radius: 10px; font-size: clamp(12px, 1.7vmin, 18px); font-weight: 700; text-decoration: none; transition: background .15s ease, border-color .15s ease; }
 .lobby-play-btn:hover { background: #4b3a9e; border-color: #ffd33d; color: #fff; }
 .podium { font-size: clamp(26px, 5.2vmin, 64px); margin-bottom: 1.8vh; animation: floatTrophy 2s ease-in-out infinite; }
 .scaleRow { display: flex; align-items: center; gap: clamp(8px, 1.5vw, 20px); background: #2d2266; border-radius: 12px; padding: clamp(8px, 1.2vh, 16px) clamp(10px, 1.8vw, 24px); margin: .7vh 0; font-size: clamp(14px, 2.6vmin, 30px); animation: fadeSlideUp .28s ease-out both; }
 .scaleTrack { flex: 1; height: clamp(12px, 2vh, 22px); background: #1b1340; border-radius: 99px; overflow: hidden; }
 .scaleFill { height: 100%; background: linear-gradient(90deg, #7c4dff, #ffd33d); border-radius: 99px; transform-origin: left; animation: growBar .6s ease-out both; }
 .wheelStage { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; margin-top: 1vh; animation: popIn .3s ease-out both; }
 .wheelTitle { font-size: clamp(22px, 4.4vmin, 54px); font-weight: 900; margin: .5vh 0 1.5vh; color: #ffd33d; text-shadow: 0 4px 18px rgba(0,0,0,.45); }
 .wheelSub { font-size: clamp(14px, 2.2vmin, 26px); opacity: .8; font-weight: 600; }
 #wheelCanvas { width: min(48vh, 72vw); height: min(48vh, 72vw); }
 .wheelWinner { min-height: 7.5vh; margin-top: 1.5vh; display: flex; align-items: center; justify-content: center; }
 .wheelWinnerBadge { background: linear-gradient(135deg, #26890c, #1b6b08); border: 3px solid #ffd33d; border-radius: 18px; padding: clamp(8px, 1.4vh, 18px) clamp(16px, 3.5vw, 42px); font-size: clamp(18px, 3.6vmin, 44px); font-weight: 900; color: #fff; animation: popIn .3s ease-out both, winnerGlow 1.2s ease-in-out infinite; }
 /* Steuerleiste blendet sich außerhalb der Lobby nach Inaktivität aus (QR-Ecke bleibt) – kein display-Wechsel, kein Layout-Sprung */
 .footer > :not(#qrCorner) { transition: opacity .35s ease, visibility 0s linear 0s, transform .12s ease, background .2s ease, border-color .15s ease; }
 .footer.ctlHidden > :not(#qrCorner) { opacity: 0 !important; visibility: hidden; pointer-events: none; transition: opacity .6s ease, visibility 0s linear .6s; }
 body.ctlIdle { cursor: none; }
 @media (min-width: 1000px) and (min-aspect-ratio: 5/4) {
  .resSplit.side { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); align-items: start; gap: clamp(16px, 2.5vw, 48px); }
 }
 @media (max-width: 820px), (max-aspect-ratio: 1/1) {
  .row.lobby { flex-direction: column; align-items: center; text-align: center; }
  .lobbyMain { width: 100%; }
  .lobby img { width: min(32vh, 58vw, 260px); }
  .joinHint { max-width: none; }
  .lobbyRules { text-align: left; }
  .chips { justify-content: center; }
  .mlVotes > div { flex-wrap: wrap; }
  #drawWrap { flex-direction: column; }
  #tvCanvas { width: 100%; max-height: 44vh; }
 }
 @media (max-width: 640px) {
  .answers, .answers.many, .cols { grid-template-columns: 1fr; }
  #app.game:not(.res) > .answers, #app.game:not(.res) > .answers.compact { max-height: none; }
 }
</style></head>
<body>
<div id="app"></div>
<div id="drawWrap">
  <canvas id="tvCanvas" width="1000" height="620"></canvas>
  <div class="drawSide">
    <div id="drawInfo" class="card"></div>
    <div id="drawGuesses" class="guesses"></div>
  </div>
</div>
<div class="footer">
  <div id="qrCorner" class="qr-corner"><img src="/qr.png" alt="QR-Code"><div id="qrUrl" class="url"></div></div>

  ? `<span class="streakBadge ${p.streak >= 3 ? 'hot' : ''}">🔥 ${p.streak}×</span>`
  : '';

const lb = () => {
  const isRes = S.phase === 'result';
  if (S.teamMode && S.teams && S.teams.length) {
    return `<div class="lb">${S.teams.map((t, i) => {
      const gainHtml = isRes && t.lastGain > 0 ? `<span class="gainBadge">+${t.lastGain}</span>` : '';
      const from = isRes && typeof t.prevScore === 'number' ? t.prevScore : t.score;
      return `<div style="animation-delay:${i * 55}ms"><span>${i + 1}. ${esc(t.label)} <small style="opacity:.75">(${t.members.map(esc).join(', ')})</small></span><span>${gainHtml}<b class="scoreNum" data-from="${from}" data-to="${t.score}">${from} Pkt</b></span></div>`;
    }).join('')}</div>`;
  }
  return `<div class="lb">${S.players.map((p, i) => {
    const gainHtml = isRes && p.lastGain > 0 ? `<span class="gainBadge">+${p.lastGain}</span>` : '';
    const from = isRes && typeof p.prevScore === 'number' ? p.prevScore : p.score;
    return `<div style="animation-delay:${i * 55}ms"><span>${i + 1}. ${p.avatar ? esc(p.avatar) + ' ' : ''}${esc(p.name)}${streakTag(p)}</span><span>${gainHtml}<b class="scoreNum" data-from="${from}" data-to="${p.score}">${from} Pkt</b></span></div>`;
  }).join('')}</div>`;
};

function animateScores() {
  if (!S || S.phase !== 'result') return;
  const ak = `${S.mode}:${S.idx}:result`;
  const nodes = [...document.querySelectorAll('.scoreNum')];
  if (!nodes.length) return;
  if (ak === lastScoreAnimKey) {
    nodes.forEach(n => { n.textContent = `${n.dataset.to} Pkt`; });
    return;
  }
  lastScoreAnimKey = ak;
  cancelAnimationFrame(scoreRaf);
  const start = performance.now();
  const dur = 750;
  function tick(now) {
    const t = Math.min(1, (now - start) / dur);
    const ease = 1 - Math.pow(1 - t, 3);
    nodes.forEach(n => {
      const from = Number(n.dataset.from) || 0;
      const to = Number(n.dataset.to) || 0;
      const val = Math.round(from + (to - from) * ease);
      n.textContent = `${val} Pkt`;
    });
    if (t < 1) scoreRaf = requestAnimationFrame(tick);
  }
  scoreRaf = requestAnimationFrame(tick);
}

function renderLiveAvBar(justSet) {
  if (!S || !S.players || !S.players.length) return '';
  return S.players.map(p => {
    const isDone = !!p.answered;
    const isJust = justSet && justSet.has(p.name);
    return `<span class="liveAvPill ${isDone ? 'done' : ''} ${isJust ? 'justDone' : ''}">${p.avatar ? esc(p.avatar) : '😎'} ${esc(p.name)}${isDone ? ' ✓' : ''}${streakTag(p)}</span>`;
  }).join('');
}

// Gleiche Formen wie auf den Handys (TV-Modus), damit niemand nur über die Farbe zuordnen muss
const ANS_SHAPES = ['▲', '◆', '●', '■'];
const hostAvatarOf = name => {
  const p = S && S.players ? S.players.find(x => x.name === name) : null;
  return p && p.avatar ? p.avatar : '😎';
};

// Kleine Avatar-Badges („wer hat das gewählt“), gestaffelt per popIn eingeblendet
function pickerBadges(list, delay0 = 0) {
  if (!list || !list.length) return '';
  return `<span class="pickers">${list.map((p, i) => `<span class="pk" style="animation-delay:${delay0 + i * 70}ms"><i>${esc(p.avatar || '😎')}</i><b>${esc(p.name)}</b></span>`).join('')}</span>`;
}
// Eine Antwort-Kachel; im Ergebnis mit Zähler und Pickern darunter.
// o: { res, state ('winner'|'dim'|''), cls, shape, prefix (HTML), count, pickers, style }
function ansTile(i, label, o = {}) {
  const shape = o.shape && ANS_SHAPES[i] ? `<span class="shape" aria-hidden="true">${ANS_SHAPES[i]}</span>` : '';
  const style = o.style || (o.res ? '' : `animation-delay:${i * 65}ms`);
  return `<div class="ansCell"><div class="ans tile ${o.cls || `c${i}`} ${o.state || ''}"${style ? ` style="${style}"` : ''}>${shape}<span class="txt">${o.prefix || ''}${esc(label)}</span>${o.res ? `<span class="n">${o.count || 0}</span>` : ''}</div>${o.res ? pickerBadges(o.pickers, 300 + i * 140) : ''}</div>`;
}
// Index-basierte Antworten (Quiz, Bild-Quiz, Song-Quiz): Formen + Ergebnis mit Pickern
function indexAnswers(labels, r, res, compact) {
  return `<div class="answers${compact ? ' compact' : ''}${labels.length > 4 ? ' many' : ''}">${labels.map((a, i) => ansTile(i, a, {
    res, shape: true,
    state: res ? (i === r.correct ? 'winner' : 'dim') : '',
    prefix: res && i === r.correct ? '✔ ' : '',
    count: res ? r.counts[i] : 0,
    pickers: res && r.pickers ? r.pickers[i] : null,
  })).join('')}</div>`;
}

let wheelStop = () => {}, activeSpinId = -1;

  wheelStop();
  wheelStop = pgRunWheel(cvs, spin, {
    R: 0.43, cyOff: 10, rimPad: 12, rimLine: 4, sliceLine: 2.5, winLine: 6,
    font: N => (N > 12 ? 17 : N > 8 ? 20 : N > 5 ? 23 : 26), labelMax: 18, labelInset: 18,
    hubLine: 6, hubFont: 28, pins: true, shadow: true,
    ptr: { w: 18, h: 14, tip: 26, top: 16, line: 3.5 },
    onTick: () => sfx('wheelTick'),
    onWin: label => {
      sfx('wheelWin');
      pgConfetti(65);
      const wb = document.getElementById('wheelWinner');
      if (wb) wb.innerHTML = `<div class="wheelWinnerBadge">🎉 ${esc(label)}</div>`;
    },
    isActive: () => !!(S && S.phase === 'spin' && S.spin && S.spin.id === spin.id),
  });
}

// Foto-Challenge: anonyme Fotos zur Abstimmung, nach der Auswertung mit Namen und Stimmen (Sieger zuerst)
function snapWall(c) {
  if (c.act !== 'snap' || !c.photos || !c.photos.length) return '';
  const list = c.resolved ? [...c.photos].sort((a, b) => b.votes - a.votes) : c.photos;
  const top = c.resolved ? Math.max(...list.map(p => p.votes)) : -1;
  // Quadrate so groß wie möglich, aber alle unter der Karte sichtbar (Spalten nach Seitenverhältnis der Restfläche)
  const cnt = list.length, gap = 12, w = innerWidth * 0.94, h = innerHeight * (c.resolved ? 0.38 : 0.5); // Auswertung: Karte ist höher
  const cols = Math.min(cnt, Math.max(1, Math.ceil(Math.sqrt(cnt * w / h))));
  const rows = Math.ceil(cnt / cols);
  const sz = Math.floor(Math.min((w - (cols - 1) * gap) / cols, (h - (rows - 1) * gap) / rows));
  return `<div class="snapWall" style="--sz:${sz}px">${list.map((p, n) => `<figure class="${c.resolved && top > 0 && p.votes === top ? 'win' : ''}" style="--d:${n * 80}ms">
    <img src="${esc(p.url)}" alt="${c.resolved ? `Foto von ${esc(p.name)}` : `Foto ${n + 1}`}">
    <figcaption>${c.resolved ? `${p.votes === top && top > 0 ? '🏆 ' : ''}${esc(p.name)}${top > 0 ? ` · ${p.votes} 🗳️` : ''}` : `#${n + 1}`}</figcaption></figure>`).join('')}</div>`;
}

function renderView() {
  if (!S) return;
  if (S.phase !== 'end') stopEndSlides();
  qrCorner.style.display = S.phase === 'lobby' ? 'none' : 'flex';
  if (lobbyPlayBtn) lobbyPlayBtn.style.display = S.phase === 'lobby' ? 'inline-block' : 'none';
  const hostNextBtn = document.getElementById('hostNextBtn');
  if (hostNextBtn) {
    const cardWaiting = S.phase === 'card' && S.card && !S.card.resolved && !['info', 'rule'].includes(S.card.act);
    // Foto-Abstimmung: ab 2 Stimmen darf der TV auswerten (ohne Zeitlimit)
    const snapReady = cardWaiting && S.card.act === 'snap' && S.card.stage === 'vote' && S.card.voters.length >= 2;
    const showNext = ['lobby', 'result', 'discuss', 'end'].includes(S.phase) || (S.phase === 'card' && (!cardWaiting || snapReady));
    hostNextBtn.style.display = showNext ? 'inline-block' : 'none';
    hostNextBtn.textContent = S.phase === 'lobby' ? '▶ Spiel starten' : S.phase === 'end' ? '🔄 Nochmal' : snapReady ? '🏁 Auswerten' : '▶ Weiter';
  }
  qrUrl.textContent = url;
  const drawing = S.mode === 'draw' && S.phase === 'question';
  drawWrap.style.display = drawing ? 'flex' : 'none';
  app.classList.toggle('drawing', drawing);
  // Spielansichten (nicht Lobby/Ende/Drehrad) nutzen das vertikale Ausbalancieren
  app.classList.toggle('game', !['lobby', 'end'].includes(S.phase) && !(S.phase === 'spin' && S.spin));
  app.classList.toggle('res', S.phase === 'result');
  const title = S.isMix && S.phase !== 'lobby' && S.phase !== 'end'
    ? `🎲 Party-Mix · ${TITLES[S.mode] || S.mode}`
    : (TITLES[S.mode] || 'PartyGame');

  const tk = `${S.mode}:${S.idx}:${S.phase}`;
  const curAnswered = new Set((S.players || []).filter(p => p.answered).map(p => p.name));
  const justAnswered = new Set();
  if (tk === lastTrackKey && (S.phase === 'question' || S.phase === 'go')) {
    for (const n of curAnswered) {
      if (!prevAnsweredNames.has(n)) justAnswered.add(n);
    }
    if (justAnswered.size > 0) sfx('pop');
  }
  lastTrackKey = tk;
  prevAnsweredNames = curAnswered;

  if (S.phase !== 'spin') {
    activeSpinId = -1;
    wheelStop();
  }

  if (S.phase === 'spin' && S.spin) {
    lastRenderSig = '';
    if (activeSpinId === S.spin.id && document.getElementById('wheelCanvas')) return;
    activeSpinId = S.spin.id;
    app.innerHTML = `<div class="wheelStage">
      ${S.spin.subtitle ? `<div class="wheelSub">${esc(S.spin.subtitle)}</div>` : ''}
      <div class="wheelTitle">${esc(S.spin.title || '🎡 Drehrad')}</div>
      <canvas id="wheelCanvas" width="580" height="580"></canvas>
      <div id="wheelWinner" class="wheelWinner"></div>
    </div>`;
    startWheelAnim(S.spin);
    return;
  }

  if (S.phase === 'card' && S.card) {
    const c = S.card;
    const cardSig = `card:${S.idx}:${JSON.stringify(c)}:${c.resolved ? S.players.map(p => p.score).join(',') : ''}`;
    if (cardSig === lastRenderSig) return;
    lastRenderSig = cardSig;
    const avName = n => esc((S.players.find(p => p.name === n) || {}).avatar || '😎') + ' ' + esc(n);
    const vs = c.duel ? c.duel.map(avName).join(' &nbsp;⚔️&nbsp; ') : c.pair ? c.pair.map(avName).join(' &nbsp;&amp;&nbsp; ') : '';
    let info = '';
    if (!c.resolved) {
      if (c.act === 'vote') info = `🗣️ Reihum erzählen – dann auf dem Handy den besten Beitrag wählen (+${c.reward})<br>🗳️ ${c.voters.length}/${S.players.length} haben abgestimmt`;
      else if (c.act === 'duel') info = `🏆 Sieger bekommt +${c.reward} · Der Gastgeber entscheidet im Admin`;
      else if (c.act === 'rule') info = '📜 Gilt für die nächsten 3 Runden';
      else if (c.act === 'info') info = '✋ Los geht’s – danach „▶ Weiter“';
      else if (c.act === 'yesno') {
        const judge = `<br>📱 Gelungen? Abstimmung am Handy – ${c.voters.length}/${(c.judges || []).length} · Mehrheit entscheidet`;
        if (c.type === 'photo') info = `📸 +${c.reward} ${c.pair ? 'für beide' : 'für alle'}${judge}`;
        else if (c.type === 'group') info = `✅ +${c.reward} für alle · ❌ ${S.alcoholFree ? 'alle machen 5 Kniebeugen' : 'alle trinken'}${judge}`;
        else info = `✅ +${c.reward}${c.minus ? ` · ❌ −${c.minus}` : ''}${judge}`;
      }
      else if (c.act === 'snap' && c.stage === 'collect') {
        const done = c.submitted || [];
        const shooters = c.duel ? S.players.filter(p => c.duel.includes(p.name)) : S.players;
        info = `${c.duel ? '⚔️ Nur die beiden fotografieren am Handy, alle anderen stimmen danach ab' : '📱 Jeder macht ein Foto am Handy'} – die Fotos gibt’s erst bei der Abstimmung zu sehen<br>📸 ${done.length}/${shooters.length} Fotos da · ${c.duel ? 'Besseres' : 'Bestes'} Foto +${c.reward}, jedes Foto +10
          <div class="snapWho">${shooters.map(p => `<span class="${done.includes(p.name) ? 'ok' : ''}">${esc(p.avatar || '😎')} ${esc(p.name)}${done.includes(p.name) ? ' ✓' : ''}</span>`).join('')}</div>`;
      } else if (c.act === 'snap') {
        info = `🗳️ Welches Foto ist ${c.duel ? 'besser' : 'das beste'}? Abstimmung am Handy (anonym) – ${c.voters.length}/${(c.snapVoters || []).length}${c.voters.length < 2 ? ' · weiter ab 2 Stimmen' : ''}`;
      }
      else info = '⏳ Der Gastgeber wertet im Admin aus…';
    }
    const bad = /^❌/u.test(c.outcome || '');
    app.innerHTML = `<div class="bar"><div id="bar" style="width:100%"></div></div>
      <div class="hdrInfo">🎪 Party-Karte &nbsp;|&nbsp; nach Runde ${S.idx + 1} / ${S.total}<span id="sec" style="float:right;font-weight:700"></span></div>
      <div class="pcard">
        <div class="pcKicker">Party-Karte</div>
        <div class="pcTitle">${esc(c.title)}</div>
        ${c.targetLabel ? `<div class="pcTarget">${esc(c.targetLabel)}</div>` : ''}
        ${vs ? `<div class="pcTarget">${vs}</div>` : ''}
        <div class="pcText">${esc(c.text)}</div>
        ${info ? `<div class="pcInfo">${info}</div>` : ''}
        ${c.resolved ? `<div class="pcOutcome${bad ? ' bad' : ''}">${esc(c.outcome)}</div>` : ''}
      </div>
      ${snapWall(c)}
      ${c.resolved && !(c.photos && c.photos.length) ? `<div class="pcLb">${lb()}</div>` : ''}`;
    return;
  }

  if (S.phase === 'lobby') {
    renderLobby(title);
    return;
  }

  if (S.phase === 'end') {
    const countEl = document.getElementById('endPhotoCount');
    if (countEl) countEl.textContent = S.photoCount ? ` (${S.photoCount})` : '';
    const endSig = `end:${S.mode}:${S.players.length}:${S.photoCount > 0}`;
    if (lastRenderSig === endSig) return;
    lastRenderSig = endSig;
    // Abend-Rückblick: alle Auszeichnungen kompakt im Raster
    const awardsHtml = S.awards && S.awards.length
      ? `<div class="awardGrid">${S.awards.map(a => `<div class="card"><div style="font-size:2.8vh">${a.icon} ${esc(a.title)}</div><div style="font-size:3.4vh;font-weight:800;color:#ffd33d;margin:.3vh 0">${esc(a.name)}</div><div style="opacity:.8;font-size:2.2vh">${esc(a.detail)}</div></div>`).join('')}</div>`
      : '';
    const photosHtml = `<div class="card endPhotos">
        ${S.photoCount ? '<div class="endSlideBox"><img id="endSlide" alt=""><div id="endSlideCap" class="endSlideCap"></div></div>' : '<div class="endNoPhoto">📸</div>'}
        <div style="text-align:center"><div style="font-size:clamp(18px,3.4vmin,40px);font-weight:900;color:#ffd33d">📸 Fotos des Abends<span id="endPhotoCount">${S.photoCount ? ` (${S.photoCount})` : ''}</span></div>
          <img class="endQr" src="/qr.png?room=${encodeURIComponent(ROOM_CODE)}&for=fotos" alt="QR zur Galerie">
          <div style="opacity:.85;font-size:clamp(13px,2.2vmin,26px)">Scannen: ansehen, herunterladen & hochladen · 7 Tage</div></div>
      </div>`;
    app.innerHTML = `<h1>🏆 Endergebnis – ${title}</h1>${renderPodium()}${photosHtml}${awardsHtml}${lb()}`;
    startEndSlides();
    const slide = document.getElementById('endSlide');
    if (slide && endSlideList.length && endSlideTimer) {
      const cur = endSlideList[Math.max(0, endSlideIdx - 1) % endSlideList.length];
      slide.src = cur.url;
      document.getElementById('endSlideCap').textContent = cur.cap;
    }
    return;
  }

  const res = S.phase === 'result';
  const done = S.players.filter(p => p.answered).length;
  const finalTag = S.isFinalRound ? ` &nbsp;|&nbsp; <span style="background:#e21b3c;padding:.3vh 1vw;border-radius:8px;font-weight:800">🔥 FINALRUNDE · 2× PUNKTE</span>` : '';
  const liveBarHtml = !res && S.phase !== 'discuss' && S.phase !== 'write'
    ? `<div id="liveAvBar" class="liveAvBar">${renderLiveAvBar(justAnswered)}</div>`
    : '';
  const header = `<div class="bar"><div id="bar" style="width:100%"></div></div>
    <div class="hdrInfo">${title} &nbsp;|&nbsp; Runde ${S.idx + 1} / ${S.total} &nbsp;|&nbsp; <span id="doneCnt">${done}/${S.players.length} fertig</span>${finalTag}<span id="sec" style="float:right;font-weight:700"></span></div>${S.rule ? `<div class="ruleTag">📜 Regel: ${esc(S.rule)}</div>` : ''}${liveBarHtml}<div class="hdrEnd"></div>`;
  // Kandidaten-Chips mit Avatar für Abstimmungen (Wer würde am ehesten / Imposter)

  (() => {

      const vals = [r.answer, ...valid.map(e => e.val)];

      const span = maxV - minV || Math.max(1, Math.abs(r.answer) * 0.2);

        `<div class="chips" style="margin-top:3vh;text-align:center">${S.players.map(p => `<span style="${p.answered ? 'background:#26890c' : 'opacity:.5'}">${p.avatar ? esc(p.avatar) + ' ' : ''}${esc(p.name)}${p.answered ? ' ✓' : ''}</span>`).join('')}</div>`;

        : '';

        </div>`;
    const ansHtml = indexAnswers(S.q.a, r, res, true);
    app.innerHTML = header + `<div class="q sm" style="margin:1.2vh 0 1.5vh">${esc(S.q.q)}</div>` + songBanner +
      (res

  })();

    const mr = S.missionReveal;
    const status = mr.resolved
      ? (mr.success ? '<span style="color:#3dd68c">✅ Geschafft! (+15 Pkt)</span>' : '<span style="color:#ff6b81">❌ Aufgeflogen!</span>')
      : '<span style="color:#ffd33d">⏳ Host bewertet im Admin…</span>';
    app.insertAdjacentHTML('beforeend', `<div class="card" style="margin-top:2vh;border:2px solid #ffd33d;background:rgba(255,211,61,0.12);text-align:center">
      <div style="font-size:2.8vh;font-weight:800;color:#ffd33d">🕵️ Geheime Mission · ${esc(mr.playerName)}</div>
      <div style="font-size:3vh;margin:.6vh 0">„${esc(mr.text)}“</div>
      <div style="font-size:2.8vh;font-weight:700">${status}</div>
    </div>`);
  }
}

function updateTimerUI() {
  const b = document.getElementById('bar'), sec = document.getElementById('sec');
  if (!S || S.phase === 'lobby' || S.phase === 'end' || S.phase === 'spin') return;
  if (!clientDeadline) {
    pgSetBar(b, 1);
    const cardIdle = S.phase === 'card' && S.card && (S.card.resolved || ['info', 'rule'].includes(S.card.act));
    pgSetText(sec, S.paused ? '⏸ PAUSE' : S.phase === 'discuss' ? 'Diskussion' : S.phase === 'write' ? 'Ausdenken…' : (S.phase === 'result' || cardIdle) ? 'Tippe „▶ Weiter“' : '');
    return;
  }
  const left = Math.max(0, clientDeadline - performance.now());
  const dur = Math.max(1000, clientTotalMs);
  pgSetBar(b, left / dur);
  const sLeft = Math.ceil(left / 1000);
  if (S.phase === 'question' && sLeft >= 1 && sLeft <= 3 && sLeft !== lastTickSec) {
    lastTickSec = sLeft;
    sfx('tick');
  }
  if (sec) {
    pgSetText(sec, S.phase === 'result' || (S.phase === 'card' && S.card && S.card.resolved) ? `Weiter in ${sLeft}s…` : `⏱ ${sLeft}s`);
    sec.classList.toggle('urgent', (S.phase === 'question' || S.phase === 'go') && sLeft >= 1 && sLeft <= 3);
  }
}

setInterval(updateTimerUI, 100);

addEventListener('keydown', e => {
  if (!S) return;
  if (e.key === ' ' || e.key === 'Enter') socket.emit(S.phase === 'lobby' || S.phase === 'end' ? 'host:start' : 'host:next');
  if (e.key.toLowerCase() === 'r') socket.emit('host:reset');
  if (e.key.toLowerCase() === 'm') socket.emit('host:mode', MODES[(MODES.indexOf(S.mode) + 1) % MODES.length]);
  if (e.key.toLowerCase() === 'w' && (S.phase === 'lobby' || S.phase === 'end')) {
    socket.emit('host:spinWheel', e.shiftKey && S.players.length ? 'player' : 'mode');
  }
});
</script>
